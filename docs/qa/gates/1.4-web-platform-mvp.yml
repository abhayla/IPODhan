    - action: "Add Zod validation schemas for all user inputs (search, filters, forms)"
      refs: ["ipodhan-web/src/lib/api/ipo.service.ts", "ipodhan-web/src/stores/ipoStore.ts"]
    - action: "Implement real-time subscription updates (WebSocket or polling)"
      refs: ["ipodhan-web/src/components/ipo/IPOCard.tsx:142-152"]
    - action: "Run Lighthouse accessibility audit and fix violations to achieve WCAG AA (90+ score)"
      refs: ["All pages and components"]
    - action: "Measure code coverage and add tests to reach 70% minimum"
      refs: ["ipodhan-web/tests/"]

  future:  # Can be addressed later or in next sprint
    - action: "Consider httpOnly cookies for auth token storage instead of localStorage"
      refs: ["ipodhan-web/src/lib/api/client.ts:24"]
    - action: "Configure CDN for static assets delivery"
      refs: ["ipodhan-web/next.config.js"]
    - action: "Add XSS protection middleware and CSRF tokens"
      refs: ["Backend API - future story"]
    - action: "Implement structured logging with correlation IDs"
      refs: ["All error handling"]
    - action: "Add more comprehensive test coverage (40+ files, only 3 test files)"
      refs: ["ipodhan-web/tests/"]

refactoring_performed:
  - file: "ipodhan-web/src/config/env.ts"
    change: "Created centralized environment configuration"
    why: "Coding standards require env access via config objects, never direct process.env"
    how: "Created type-safe config module exporting all environment variables with defaults"

  - file: "ipodhan-web/src/lib/api/client.ts"
    change: "Replaced direct process.env access with config import"
    why: "Violated coding standard - direct environment variable access forbidden"
    how: "Imported config from @/config/env and used config.api.baseUrl instead of process.env.NEXT_PUBLIC_API_URL"

  - file: "ipodhan-web/src/components/common/ErrorBoundary.tsx"
    change: "Replaced process.env.NODE_ENV with config.app.isDevelopment"
    why: "Consistency with new centralized config pattern"
    how: "Imported config and used type-safe boolean config.app.isDevelopment"

  - file: "ipodhan-web/src/lib/analytics/gtag.ts"
    change: "Replaced process.env.NEXT_PUBLIC_GA_MEASUREMENT_ID with config"
    why: "Consistency with centralized config pattern"
    how: "Imported config and used config.analytics.googleAnalyticsId"

compliance:
