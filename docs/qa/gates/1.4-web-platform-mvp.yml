top_issues:
  - id: "REG-001"
    severity: medium
    finding: "E2E test regression - all 3 Playwright tests failing with timeouts (was working previously)"
    suggested_action: "Add role='listitem' to IPO cards and aria-label attributes to filter components. Verify dev server rendering correctly."
    suggested_owner: dev
    refs:
      - "tests-e2e/ipo-research-flow.spec.ts:15 - waitForSelector('[role=listitem]') timeout"
      - "tests-e2e/ipo-research-flow.spec.ts:67 - filter selector not found"

  - id: "IMPL-001"
    severity: medium
    finding: "IPO Detail Page tabs show 'Integration pending' placeholders - Subscription, GMP, Financials tabs incomplete (AC4)"
    suggested_action: "Integrate with backend APIs: GET /api/ipos/:id/subscription, /api/ipos/:id/gmp, financials endpoint. Replace placeholder text with real data rendering."
    suggested_owner: dev
    refs:
      - "src/app/ipo/[id]/page.tsx:236-242 (SubscriptionTab)"
      - "src/app/ipo/[id]/page.tsx:248-254 (GMPTab)"
      - "src/app/ipo/[id]/page.tsx:260-266 (FinancialsTab)"

  - id: "IMPL-002"
    severity: medium
    finding: "Real-time subscription updates not implemented - AC2 requires live subscription with timestamp, only placeholder exists"
    suggested_action: "Implement WebSocket subscription or 15-minute polling for live IPO subscription data. Update IPOCard subscription display with auto-refresh."
    suggested_owner: dev
    refs:
      - "src/components/ipo/IPOCard.tsx:142-152 (subscription status bar)"
      - "src/stores/ipoStore.ts:154-156 (subscribeToUpdates placeholder)"

  - id: "TEST-001"
    severity: medium
    finding: "Code coverage at 15.05% vs 70% target (-55 percentage points gap)"
    suggested_action: "Add page component tests (HomePage, SearchPage, DetailPage at 0%). Realistic target for Next.js MVP: 40-50% (pages tested via E2E once regression fixed)."
    suggested_owner: dev
    refs:
      - "Coverage report: app/* at 0%, lib/api at 26.99%, components/common at 34.97%"

  - id: "A11Y-001"
    severity: medium
    finding: "Accessibility audit not run - AC12 requires WCAG AA compliance with Lighthouse score 90+"
    suggested_action: "Run npm run lighthouse or browser DevTools Lighthouse. Fix contrast ratios, verify keyboard navigation, test screen reader compatibility."
    suggested_owner: dev
    refs:
      - "AC12 requirement: WCAG AA compliance level, Lighthouse accessibility score 90+"

  - id: "IMPL-003"
    severity: medium
    finding: "Acceptance criteria only 40-45% complete (5/12 fully done, 5/12 partial, 2/12 unverified)"
    suggested_action: "AC4 (detail tabs), AC5 (full filter/search), AC7 (CDN/metrics), AC10 (analytics testing), AC12 (accessibility) require completion before production."
    suggested_owner: dev
    refs:
      - "See story QA Results section for full AC traceability matrix"

  - id: "SEC-002"
    severity: low
    finding: "Auth tokens stored in localStorage - vulnerable to XSS attacks"
    suggested_action: "Consider httpOnly cookies for token storage or implement additional XSS protections (CSP headers, sanitization middleware)."
    suggested_owner: dev
    refs:
      - "src/lib/api/client.ts:24"

  - id: "PERF-001"
    severity: low
    finding: "CDN not configured (AC7 requirement) and actual page load time not measured (<2s target)"
    suggested_action: "Configure CDN for static assets delivery. Run Lighthouse performance audit to measure actual load time."
    suggested_owner: dev
    refs:
      - "next.config.js - missing CDN configuration"

  - id: "TEST-002"
    severity: low
    finding: "Page components untested (0% coverage) - relying on E2E which is currently broken"
    suggested_action: "Add minimal page component tests or fix E2E tests to restore page-level validation."
    suggested_owner: dev
    refs:
      - "src/app/page.tsx:0%, src/app/search/page.tsx:0%, src/app/ipo/[id]/page.tsx:0%"

