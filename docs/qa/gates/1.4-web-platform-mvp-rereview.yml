# Waiver Justification

waiver:
  reason: "MVP_PRAGMATISM"
  explanation: |
    **WAIVED with conditions for MVP staging deployment.**

    **Why WAIVED vs PASS:**
    Story 1.4 does not meet the strict 70% coverage acceptance criteria (actual: 15.09%).
    However, the quality of implementation in tested areas is EXCELLENT.

    **Why WAIVED vs CONCERNS:**
    All blocking security issues resolved (SEC-001 at 97.59% coverage).
    Testing infrastructure is complete and operational.
    Coverage gap is explainable by MVP scaffolding reality.

    **Conditions for Waiver Acceptance:**
    ✅ 1. SEC-001 resolved with 97.59% validation coverage
    ✅ 2. TEST-001 infrastructure operational (58 tests passing)
    ✅ 3. Business logic covered (validation 97%, stores 64%, key components 79-100%)
    ✅ 4. E2E tests available for integration scenarios (Playwright suite)
    ✅ 5. Coverage target (70%) deferred to Story 1.5+ with feature maturity
    ✅ 6. No security vulnerabilities at API boundaries
    ✅ 7. All integration tests passing (9/9)
    ✅ 8. Test execution performant (<5s for full suite)

    **Decision Rationale:**
    This is a classic MVP trade-off: perfect coverage vs time-to-market.
    The developer correctly prioritized:
    - Security boundaries (97.59% validated)
    - Business logic (stores, key components)
    - Test infrastructure (Vitest + coverage + E2E separation)

    Over:
    - Page-level unit tests (Next.js routing boilerplate)
    - Unused utility coverage (search not in MVP flow)
    - Shallow component tests (E2E covers integration)

    **This is the RIGHT call for MVP.**

  conditions:
    - "Deploy to staging only (not production)"
    - "Execute full E2E test suite on staging (Playwright)"
    - "Monitor for runtime errors via Sentry integration"
    - "Story 1.5 MUST address coverage gap (target: 50%+ improvement)"
    - "Story 1.5 MUST add page-level tests for new features"
    - "Accessibility audit (A11Y-001) required before production"

  approval_required_from:
    - "Product Owner"
    - "Tech Lead"

