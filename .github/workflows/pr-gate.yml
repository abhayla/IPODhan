name: PR Gate

# Minimal, always-on check for every PR into main. Deliberately narrow (lint +
# type-check + unit tests only, no E2E/Lighthouse) so it stays fast and cheap
# on GitHub-hosted minutes — ci.yml/test.yml run the full suite but are
# manual-only (workflow_dispatch) after a prior billing block from running the
# heavy suite on every push/PR. This is the check to require once branch
# protection / required status checks are available (private free-plan repos
# don't support them yet).

on:
  pull_request:
    branches: [main]
    # Docs-only PRs don't need lint/type-check/unit tests to burn Actions minutes.
    # Checked for runtime coupling first (T-190): grepped web/tests, scraper/tests,
    # scraper/src/tests for any readFileSync/fs.readFile/require of a docs/*.md
    # path. Only hit was a code COMMENT (not a runtime read) in
    # scraper/tests/unit/index-listing-performance-wiring.test.ts referencing
    # docs/monitoring/scrape-cadence-measurement.md — no negation entry needed.
    #
    # GitHub only honors "!" negation on `paths` (never `paths-ignore`), and forbids
    # mixing `paths` with `paths-ignore` on one event - so the docs-only skip and its
    # registry exceptions are expressed as one `paths` list instead.
    # Order matters, later patterns win; registry directories are code contracts
    # read by scripts/tests/audit-detection-floor.test.mjs case 79.
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - 'docs/reviews/detection-checks/**'
      - 'docs/reviews/detection-checks.json'
      - 'docs/reviews/failure-classes/**'

# No main-branch guard needed here (T-190 review): this workflow only triggers
# on `pull_request`, never on `push` to main, and the group is scoped per PR
# number — so cancel-in-progress can never cancel a run tied to main.
concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: Lint, Type-check & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        # fetch-depth: 0 (full history) — the design-traceability gate below
        # runs `git show <base>:docs/design/rules.json` and `git diff
        # <base>...HEAD` against the pull request's base commit (item 20
        # mode 4). actions/checkout defaults to a depth-1 shallow clone of
        # only the PR merge commit, so the base commit is absent locally and
        # both git calls fail with "unknown revision" — turning the gate
        # into an unconditional exit 2 on every PR. Full history avoids that
        # without hand-rolling a second fetch of just the base sha.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Write-ratchet self-test (T-316)
        # Mutation-proof: scripts/tests/check-write-ratchet.test.mjs imports
        # the actual PATTERNS from the script under test, so a deleted
        # pattern turns this red before the ratchet check below can silently
        # stop catching that pattern class. No deps needed (Node builtins only).
        run: node --test scripts/tests/check-write-ratchet.test.mjs

      - name: "Web integration baseline gate self-test (item 1 slice s3d, issue #461)"
        # Mutation-proof: scripts/tests/check-web-integration-baseline.test.mjs
        # imports the actual exported functions (extractFailingFiles,
        # normalizeFileName, diffAgainstBaseline) from the checker script, so a
        # weakened guard (e.g. a bare glob that matches nothing, or a suite that
        # registers zero tests) turns this red before ci.yml's gate can silently
        # stop enforcing shrink-only on the web integration suite. Literal path,
        # never a glob — a glob matching nothing exits 0 same as a real pass
        # (issue #461). No deps needed (Node builtins only).
        run: node --test scripts/tests/check-web-integration-baseline.test.mjs

      - name: "Scripts type-check exclude shrink-only guard (issue #434)"
        # config/scripts-typecheck-exclude-baseline.json is the only
        # legitimate source of scraper/tsconfig.scripts.json exclusions; a
        # hand-added exclusion or a grown exclude count turns this red. No
        # deps needed (Node builtins only).
        run: node --test scripts/tests/scripts-typecheck-exclude-shrink.test.mjs

      - name: "Substance-check self-tests (#597, #601, #608)"
        # These three were UNWIRED and therefore never ran in CI - they passed
        # by not being in the pipeline, which is the wire-or-retire shape this
        # repo already has a failure class for. Found 2026-09-11 while checking
        # whether a newly added test file actually executes: 28 of the 51 files
        # under scripts/tests/ are not named by this workflow, so more than half
        # of them are green locally and absent here. That systemic gap is filed
        # separately; these three are the ones this lane added or depends on.
        #
        # degenerate-band-check: drives the real predicate over all four
        #   outcomes, including the oracle-disagreement branch that surfaced 22
        #   wrong prices on production.
        # issue-size-floor-message: proves the floor check neither claims a
        #   price band it lacks nor denies an authoritative price it has.
        # audit-substance-plausibility: STATIC - asserts every row.<col> a
        #   predicate reads is present in the audit SELECT. This is the one that
        #   went red locally when a predicate started reading face_value before
        #   the column was added, and CI could not have caught that.
        #
        # All three are Node builtins only - no database, no deps.
        run: |
          node --test \
            scripts/tests/degenerate-band-check.test.mjs \
            scripts/tests/issue-size-floor-message.test.mjs \
            scripts/tests/audit-substance-plausibility.test.mjs
      - name: Detection-floor checks self-test (T-335)
        # Mutation-proof: scripts/tests/audit-detection-floor.test.mjs imports
        # the actual predicates from scripts/lib/detection-floor-checks.mjs
        # (the round-7 fresh-review coverage floor promoted to FAIL-level
        # nightly checks), so weakening/deleting a predicate turns this red
        # before it can silently stop catching that finding class again. No
        # deps needed (Node builtins only). GH_TOKEN: the design-consistency
        # positive control runs the card gate, which checks parked issues with gh.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --test scripts/tests/audit-detection-floor.test.mjs
          node --test scripts/tests/detection-floor-issue-size-select.test.mjs
          node --test scripts/tests/check-design-consistency-exit.test.mjs
          node --test scripts/tests/corpus-shape-checks.test.mjs

      - name: "NOT_APPLICABLE documents check self-test (lane B, #677)"
        # ratios_extraction_yield was retired on 2026-09-16 (#677): its population,
        # RATIOS_BASIS_ISSUE_PRICE, has no extractor by design, so the check could never
        # move. The module now NAMES never-extractable PENDING documents by type.
        run: node --test scripts/tests/not-applicable-documents.test.mjs

      - name: "IST-day guard and helper self-tests (#687)"
        # The #687 family (a day derived from the UTC clock reads as yesterday
        # for the first 5h30m of every IST day) was fixed in four slices, but
        # none of its guard tests was named here, so the fence never ran in CI.
        # no-utc-day-in-run-labels walks scripts/, scraper/src, web/lib and
        # web/app and fails on any new Date().toISOString() day slice.
        # ist-day pins scripts/lib/ist-day.mjs (the plain-Node duplicate of
        # packages/shared/src/utils/ist-day.ts) to the day-boundary instants.
        # vps-data-audit-cron-ist-day pins the nightly cron's DATE_TAG to
        # offset arithmetic, not TZ/zoneinfo. Node builtins only, no database.
        run: |
          node --test scripts/tests/no-utc-day-in-run-labels.test.mjs
          node --test scripts/tests/ist-day.test.mjs
          node --test scripts/tests/vps-data-audit-cron-ist-day.test.mjs

      - name: Row-key coverage classifier self-test (F-101)
        # The pure classifier's unit proofs ran NOWHERE in CI: a check that
        # exists and is never exercised. row-key-coverage-unresolved-marker
        # measures the three states the audit must tell apart — writer off
        # (UNVERIFIABLE), writer succeeded (PASS), writer FAILED and left the
        # `unresolved:<reason>` sentinel (FAIL) — against the real
        # classifyRowKeyCoverage, so weakening it turns this red. No deps
        # needed (Node builtins only).
        run: |
          node --test scripts/tests/row-key-coverage-checks.test.mjs
          node --test scripts/tests/row-key-coverage-unresolved-marker.test.mjs

      - name: VPS runtime preflight self-test (T-406)
        # Drives the real scripts/preflight-runtime.sh as a subprocess with
        # fake python3/tesseract/node shims + controlled env, so a weakened
        # or deleted check turns this red. No deps needed (Node builtins +
        # bash, both present on ubuntu-latest).
        run: node --test scripts/tests/preflight-runtime.test.mjs

      - name: Alias-resolution preflight self-tests (item 1 slice s14)
        # Mutation-proof: drives the real scripts/lib/alias-preflight-auto.mjs
        # as a subprocess against fabricated checkouts whose workspace link
        # points inside / outside the tree, so deleting the outside-the-root
        # check turns this red instead of silently letting a run exercise a
        # different checkout than the one under test.
        run: node --test scripts/tests/alias-preflight.test.mjs

      - name: No --experimental-strip-types subprocess in scripts/tests (CI-portability guard)
        # Mutation-proof: scans scripts/tests/*.{mjs,ts,mts} for that flag
        # passed as a spawned-process argument, which needs Node >= 22.6 and
        # is therefore red on every pr-gate run (this job pins Node 20 up to
        # this point) while staying green on any laptop with a newer Node.
        # No deps needed (Node builtins only), so it belongs here with the
        # other pre-install gates rather than after npm ci.
        run: node --test scripts/tests/no-experimental-strip-types-in-tests.test.mjs

      - name: Document-state check self-tests (T-403)
        # Mutation-proof: scripts/tests/document-state-checks.test.mjs imports
        # the real predicates from scripts/lib/document-state-checks.mjs, so
        # weakening or deleting one of the five nightly document checks turns
        # its fixture red here rather than silently disarming the audit.
        run: node --test scripts/tests/document-state-checks.test.mjs

      - name: Fix-served / deploy-status self-tests (T-425)
        # Mutation-proof: scripts/tests/fix-served-checks.test.mjs imports the
        # real m_fix_merged_not_served predicate from
        # scripts/lib/fix-served-checks.mjs (mechanism for registry class
        # merged-fix-never-deployed-while-bug-live, #265), and
        # scripts/tests/deploy-status.test.mjs drives the real deploy-status.mjs
        # set/clear file I/O against a throwaway temp file.
        run: |
          node --test scripts/tests/fix-served-checks.test.mjs
          node --test scripts/tests/deploy-status.test.mjs

      - name: Migration name-collision gate (T-403)
        # Postgres gives every table an implicit composite type of the same name,
        # so an enum and a table sharing a name fail with 42710 the first time the
        # migration is applied - i.e. at a production deploy's migrate step. This
        # gate parses every journaled migration and fails here instead. It is
        # mutation-proof: the fixtures encode the exact 0035 shape that broke.
        run: node --test scripts/tests/migration-name-collision.test.mjs

      - name: Migration journal lint (T-403 round 3)
        # drizzle's migrator only applies a journal entry whose `when` is
        # strictly greater than the last applied created_at. Entries 0045-0049
        # carry hand-typed future dates (up to 2026-09-10); a real migration
        # authored after them could sort BELOW them and be silently skipped.
        # This gate checks monotonic `when` (from idx 33 on), rejects any
        # entry dated more than a small clock-skew tolerance into the future
        # (no blanket future-dated exemption), and that every entry has its
        # .sql / snapshot artifacts. Mutation-proof: the self-test imports the
        # real predicates from scripts/lib/migration-journal-lint.mjs.
        run: |
          node --test scripts/tests/check-migration-journal.test.mjs
          node scripts/ci/check-migration-journal.mjs

      - name: Field-manifest drift gate (item 3 slice S0b)
        # scraper/config/field-manifest.json is generated by scripts/generate-field-manifest.mjs from
        # docs/design/field-source-resolution.spec.mjs (OD-5 §7.6: "the generator is the only writer;
        # CI refuses drift"). Self-test proves the 10 pre-existing rows are reproduced exactly (minus
        # two documented spec corrections); the live check then refuses a committed file the
        # generator did not produce and prints the resolved-plan diff vs this PR's base sha.
        run: |
          node --test scripts/tests/check-field-manifest-current.test.mjs
          node scripts/ci/check-field-manifest-current.mjs --base "${{ github.event.pull_request.base.sha }}"

      - name: Manifest unit follows stored unit (F-156, item 11 — detection check for threshold-in-one-unit-column-in-another)
        # 2nd occurrence of the class: the manifest's `unit` and the admin validators trusted a
        # wrong tag on 12 real columns for weeks. This proves the manifest's unit matches the
        # amount-columns probe's MEASURED current_unit, not just that the generator reproduces its
        # own prior output (the drift gate above only proves that).
        run: node --test scripts/tests/manifest-unit-matches-current-unit.test.mjs

      - name: Repair-tool module lint self-test (T-490)
        # Mutation-proof: scripts/ci/tests/require-repair-tool-module.test.mjs
        # imports the real predicates from the lint, so weakening the import
        # check or accepting an undated exemption turns this red before the
        # lint below can silently stop catching the class.
        run: node --test scripts/ci/tests/require-repair-tool-module.test.mjs

      - name: Repair-tool module - every repair/backfill tool uses the shared guards (T-490)
        # Three repair tools each re-typed the guard pattern on 2026-09-07 and
        # each got a different part wrong (no provenance row; an env-based prod
        # guard the host-based pool bypasses; a direct `ipos` writer). Every
        # scraper/scripts/{repair,backfill}-*.ts must import
        # scraper/scripts/lib/repair-tool.ts or carry a dated
        # `// repair-tool-exempt: <date> <reason>` line.
        run: node scripts/ci/require-repair-tool-module.mjs

      - name: Write ratchet — no new direct `ipos` writers (T-316/R0)
        # Grep-based gate, not ESLint (T-313C amendment): catches raw .sql/.mjs
        # writers and the runtime-resolved dynamic-table admin route that a
        # syntax-aware lint rule cannot see. Baseline is shrink-only —
        # config/write-ratchet-baseline.json. See
        # docs/architecture/write-path-hardening.md ("R0").
        run: node scripts/check-write-ratchet.mjs

      - name: Fixture provenance predicate self-test (T-518)
        # Mutation-proof: scripts/ci/tests/require-fixture-provenance.test.mjs
        # imports the real predicates from scripts/lib/fixture-provenance-checks.mjs,
        # so a weakened predicate turns this red before the gate below can
        # silently stop catching that class. No Node-version constraint.
        run: node --test scripts/ci/tests/require-fixture-provenance.test.mjs

      - name: Fixture provenance baseline shrink-only self-test (T-518)
        run: node --test scripts/tests/fixture-provenance-baseline-shrink.test.mjs

      - name: Fixture provenance gate (T-518)
        # RCA: PR #425 shipped a fixture whose OWN <title> named a different
        # company than its filename claimed, and a test asserting the
        # filename's company against it PASSED — nothing in CI caught it, a
        # human opening the file did. Every fixture under scraper/tests/fixtures/**
        # must carry a sibling <file>.meta.json (sourceUrl + capturedAt +
        # company|pageType) and, for HTML, its embedded company name must
        # match the filename. Backfill is shrink-only —
        # config/fixture-provenance-baseline.json. See
        # scraper/tests/fixtures/PROVENANCE.md.
        run: node scripts/ci/require-fixture-provenance.mjs

      - name: Design traceability self-test (item 20 / OD-52)
        # Mutation-proof: scripts/ci/tests/check-design-traceability.test.mjs
        # drives the real check-design-traceability.mjs binary against fixture
        # trees, red-then-green per failure mode, so a weakened or deleted
        # failure mode turns this red before the gate below can silently stop
        # catching that class. Runs before npm ci (Node builtins only), same
        # idiom as the repair-tool module lint self-test above.
        run: node --test scripts/ci/tests/check-design-traceability.test.mjs

      - name: Design traceability (OD-52)
        # A pull request fails when a design rule has no build item, a build
        # item's rule has no test, a test names a rule that does not exist, or
        # a rule's wording changes without its card and test being touched in
        # the same change (docs/design/build-cards/item-20-design-traceability-check.md).
        # --base resolves to the pull request's base commit so mode 4 (hash
        # drift vs base) actually runs instead of printing its SKIPPED line;
        # the checkout step above fetches full history so that base commit is
        # present locally for the `git show`/`git diff` calls this makes.
        run: node scripts/ci/check-design-traceability.mjs --base "${{ github.event.pull_request.base.sha }}"

      - name: Module boundaries self-test (item 20 / §7.6)
        # Mutation-proof: scripts/ci/tests/check-module-boundaries.test.mjs
        # drives the real check-module-boundaries.mjs binary against fixture
        # trees with a known upward import edge, so a weakened or deleted rule
        # turns this red before the gate below can silently stop catching it.
        run: node --test scripts/ci/tests/check-module-boundaries.test.mjs

      - name: Module boundaries (§7.6)
        # A lower layer (discovery -> download -> extraction -> validation ->
        # consolidation -> plan -> walk -> verification -> re-read -> read-side)
        # never imports a higher one. Baseline is shrink-only —
        # config/module-boundary-baseline.json.
        run: node scripts/ci/check-module-boundaries.mjs

      - name: Drizzle where-chaining self-test (#488)
        # Mutation-proof: scripts/ci/tests/check-drizzle-where-chaining.test.mjs
        # drives the real check-drizzle-where-chaining.mjs binary against
        # fixtures copied from the pre-fix shape of the known-defect files
        # (registrar-repository.ts, market-holiday-repository.ts,
        # backfill-ipo-reviews.ts), so a weakened or deleted rule turns this
        # red before the gate below can silently stop catching it.
        run: node --test scripts/ci/tests/check-drizzle-where-chaining.test.mjs

      - name: Drizzle where-chaining (#488)
        # Drizzle's .where() REPLACES the previous where clause rather than
        # ANDing it — a variable re-assigned from .where() more than once on
        # a path where both calls can run silently drops the earlier filter
        # (a registrar search with activeOnly=true returning inactive rows;
        # a holiday query filtered by year+exchange returning the wrong set).
        # Fix: collect conditions into an array, apply ONE where(and(...)).
        run: node scripts/ci/check-drizzle-where-chaining.mjs

      - name: Security-boundary wiring self-test (item 20 / slice 6)
        # 15 cases, most of them mutations: a name only in a comment, a second
        # declaration of the same function in another module, a comma inside a
        # string, an empty registry, a zero-file scan, and a baselined entry
        # that is now wired and must be deleted.
        run: node --test scripts/ci/tests/check-security-boundary-wired.test.mjs

      - name: Security boundaries are actually wired (item 20 / slice 6)
        # 2026-09-10: three security controls shipped in one week with nothing
        # calling them — the DNS-rebinding refusal (#487), the slot-aware flag
        # default (#476), and the registrar allow-list parameter. All three had
        # unit tests and all three passed CI. The tests covered the FUNCTION;
        # nothing covered its WIRING. Needs no install, so it runs here with the
        # other cheap gates rather than after the suites.
        run: node scripts/ci/check-security-boundary-wired.mjs

      - name: Docs-gate coverage self-test
        # A change to the documentation must reach a gate that reads the
        # documentation. Runs in BOTH workflows on purpose: editing pr-gate.yml
        # is a CODE change, so it triggers pr-gate and not docs-gate - and that
        # is exactly the edit most likely to put the documentation gates back
        # behind a skip. A self-test that only runs on the PRs it is about is
        # the same blind spot one level up.
        run: node --test scripts/ci/tests/check-docs-gate-coverage.test.mjs

      - name: Migration snapshot-chain self-test
        # 14 cases, all mutations: a fork, a duplicate id, a dangling head, a
        # cycle, a parent with a higher journal idx, and the two shapes that must
        # NOT fire (a snapshot with no journal entry, a journal entry with no
        # snapshot - both are real and legitimate in this repository). The last
        # two replay the 2026-09-10 collision with its real ids, broken and fixed.
        run: node --test scripts/ci/tests/check-migration-snapshot-chain.test.mjs

      - name: Migration snapshots form one straight chain
        # 2026-09-10: 20260910043758_salty_shen (idx 36) and
        # 20260910121813_cooing_manta (idx 37) both claimed parent 02d8a6d4 - the
        # second was generated from a branch cut before the first landed. Both
        # merged green. `npm run db:generate` then refused to run for EVERYONE,
        # and the head snapshot had lost row_key, so a migration generated from
        # that head would have tried to ADD a column every slot already has -
        # a broken deploy everywhere. (First written up as DROP COLUMN; a
        # reviewer corrected it. drizzle diffs schema.ts against the head.)
        # Needs no install, so it runs here with the other cheap gates.
        run: node scripts/ci/check-migration-snapshot-chain.mjs

      - name: ESM module-scope globals self-test (item 20 / slice 5)
        # Drives the real check against fixture trees: the mutations that prove
        # it can FAIL and the zero-files floor that proves it cannot pass on an
        # empty scan. Needs no install, so it belongs here with the other cheap
        # gates rather than after the suites.
        run: node --test scripts/ci/tests/check-esm-module-globals.test.mjs

      - name: ESM module-scope globals (static)
        # 2026-09-10: download-allowlist-loader.ts reached main with a bare
        # __dirname at module scope and the production scraper could not start
        # at all. vitest (CJS transform), tsx -e, and tsc --noEmit (@types/node
        # declares __dirname globally) were ALL green on it. This static pass
        # covers the half of the class nothing imports YET; the import smoke
        # covers the reachable half.
        run: node scripts/ci/check-esm-module-globals.mjs

      - name: Design consistency gate (docs/design/check-design-consistency.mjs)
        # The only check in the repository that catches a build card claiming
        # a retired or unknown rule id (prints "N card(s) claim a retired or
        # unknown rule id"); it ran in no workflow before this slice, so that
        # class was caught by nothing. Assigned to this gate step by a review
        # finding during item 20 slice 4 (design-traceability CI wiring).
        # D16 runs the card gate, which checks every `parked #NNN` issue on a
        # PARTIAL card with gh (item 32, #1029) and fails closed without a token.
        env:
          GH_TOKEN: ${{ github.token }}
        run: node docs/design/check-design-consistency.mjs --gate

      - name: Field-plan reclaim max-attempts pin (#762 S8 review round 2 MAJOR-1; wired #923 round 3 finding MAJOR-C)
        # The comment at packages/shared/src/db/schema.ts claims "A test in
        # the repository pins them equal so a change to one without the other
        # fails CI instead of silently degrading the plan back to a Seq Scan"
        # — the test existed in the repo but was never run by any workflow,
        # so that claim was false. Parses the three real source files (Node
        # builtins only, no pg import), so it runs here with the other cheap
        # pre-install gates, not after npm ci.
        run: node --test scripts/tests/field-plan-reclaim-max-attempts-pin.test.mjs

      - name: Shared .js-suffixed imports resolve under webpack too (staging break, run 36024250816, #989 chain)
        # `next build` never runs in this gate (too slow to run per-PR), so the
        # class that broke the 2026-09-24 21:30 IST staging deploy — a shared
        # `.js`-suffixed relative import that only resolves via tsc/tsx's
        # NodeNext .js->.ts remap, not webpack's default resolver — was
        # invisible to CI. This is the cheap stand-in: it fails the instant a
        # new such import appears without web/next.config.mjs's matching
        # resolve.extensionAlias guard. Pure fs check, no install needed.
        run: node scripts/ci/check-shared-js-imports-resolve.mjs

      - name: Install dependencies
        run: npm ci

      - name: Merge-gate self-tests (merge-if-current, stale-green incident 2026-09-11)
        # Mutation-proof: scripts/tests/merge-freshness.test.mjs drives every
        # clause of scripts/ops/lib/merge-freshness.mjs, and
        # scripts/tests/merge-if-current-cli.test.mjs builds a REAL temporary
        # git repo in which main moves a file the branch only imports, then
        # asserts the CLI process exit code. Weakening any clause (accepting a
        # CONFLICTING PR, counting a CANCELLED run as a pass, dropping the
        # scripts/ci/ prefix, blinding the import scan) turns one of these red.
        # Needs node_modules: clause 2 parses imports with ts.createSourceFile,
        # so this runs after npm ci, not with the pre-install gates above.
        run: |
          node --test scripts/tests/merge-freshness.test.mjs
          node --test scripts/tests/merge-if-current-cli.test.mjs

      - name: "Conflict-reason parity (PR #914, OD-75)"
        # Keeps the .mjs admin-only conflict-reason list equal to the TS one and
        # pins every .mjs reader of data_conflicts that counts (floor f, g, a/b;
        # admin-queue) to it. Needs node_modules: it imports admin-queue-size.mjs,
        # which imports pg at the top level, so it runs after npm ci. Its first
        # placement, with the pre-install gates, failed CI with ERR_MODULE_NOT_FOUND.
        run: node --test scripts/tests/conflict-reasons-parity.test.mjs

      - name: "IPO type population generator self-tests (item 30)"
        # Pure fixture->table transform (rowsToTypes) — canonical key, the
        # proven_scrapable boundary, and the UNCLASSIFIED bucket for a null
        # segment. Needs node_modules (the generator module imports `pg` at
        # the top level even though these tests never open a connection), so
        # this runs after npm ci, not with the pre-install gates above. The
        # live-staging --check red/green proof is NOT run here: CI has no
        # staging tunnel (see docs/design/build-cards/item-30-ipo-type-table.md).
        run: node --test scripts/tests/generate-ipo-type-population.test.mjs

      - name: Setup Node.js 22 (SSOT-parity import needs erasable-TS stripping, 22.10+, and node_modules from the step above)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Company-name normalizer parity self-test (T-518)
        # scripts/tests/normalize-company-name-parity.test.mjs imports BOTH
        # the plain-JS copy of the normalizer AND the real SSOT
        # (packages/shared/src/utils/company-name-normalizer.ts) directly, via
        # Node's erasable-TypeScript type stripping — stable only on Node
        # 22.10+ (see scripts/tests/generate-ipo-slug-parity.test.mjs for the
        # same requirement, not previously wired into any CI job). Runs AFTER
        # `npm ci` (round 2-of-2 fix — the first placement, before install,
        # failed in CI with "Cannot find package 'drizzle-orm'" because the
        # SSOT file imports it and node_modules did not exist yet; passed
        # locally only because this worktree already had node_modules
        # junctioned in — exactly the local-green/CI-red gap this task was
        # told to stop causing). Node switched back to the pinned 20
        # immediately after so every later step runs under the version the
        # rest of this job is verified against.
        run: node --test scripts/tests/normalize-company-name-parity.test.mjs

      - name: Company-identity fold parity self-test (item 12 slice A)
        # scripts/lib/repair-invariants/duplicate-ipo-rows.mjs hand-copies the
        # company-identity fold as `foldName` because a plain-node script cannot
        # import TypeScript. This asserts that copy still agrees with the SSOT
        # (packages/shared/src/utils/company-identity-fold.ts) over the shared
        # fixture. MUST stay INSIDE the Node 22 window above and before the
        # Node 20 restore below: it uses the same erasable-TS type stripping,
        # so on Node 20 the SSOT import throws and this fails loud by design.
        #
        # Why it is a gate and not a nicety: two names folding equal are
        # treated as the same company by the duplicate-row repair, which
        # DELETES a row. Drift between the two implementations means the
        # report and the repair disagree about what they are about to delete.
        run: |
          node --test scripts/tests/company-identity-fold-parity.test.mjs
          node --test scripts/tests/identity-decoration-parity.test.mjs

      - name: Duplicate-IPO-rows invariant unit tests (item 12 slice F)
        # scripts/lib/repair-invariants/duplicate-ipo-rows.mjs is the check that
        # says whether a duplicate-row repair HELD, so the shape of its answer is
        # gated here rather than left to a staging run. MUST stay INSIDE the
        # Node 22 window above: the test imports the invariant, which shares the
        # company-identity fold with the TypeScript SSOT.
        #
        # What it pins: the bracketed "(<Company> IPO)" discovery tail folds away,
        # a bare trailing token does NOT (that would merge two companies on one
        # letter), rows within the scrape-window tolerance group as ONE finding,
        # and a longer chain of rows does not exceed that tolerance in aggregate.
        run: node --test scripts/tests/duplicate-ipo-rows-invariant.test.mjs

      - name: Row-key staleness invariant unit tests (item 12 slice C)
        # scripts/lib/repair-invariants/normalized-name-current.mjs is the tool a
        # 544-row re-key is proven with, so the SHAPE of its answer is gated here
        # rather than left to a staging run that only exercises the happy path.
        # MUST stay inside the Node 22 window: the invariant imports rowKeyForName
        # from the TypeScript SSOT via erasable type stripping, so on Node 20 it
        # cannot load and every test fails.
        #
        # What it pins: an un-backfilled table reports ONE finding, not one per
        # row - and still FAILS. If it returned zero, a backfill that silently
        # never ran would read as a clean gate.
        run: node --test scripts/tests/normalized-name-current.test.mjs

      - name: Heading-hash runtime invariant self-test (item 1 slice s13)
        # This file was MERGED (fc2f8776) and had never run in CI. Its whole
        # subject is a runtime invariant - that a stored ipo_risk_factors
        # heading_hash still re-computes to itself under the current function -
        # and the guard for it did not execute on any PR. A guard that never
        # runs is the same class of defect as the hole it guards against.
        #
        # Same Node 22 constraint as its sibling above: it imports
        # headingHashForRiskFactor from the TypeScript SSOT via erasable type
        # stripping, so on Node 20 it cannot load at all.
        run: node --test scripts/tests/heading-hash-current.test.mjs

      - name: Ledger record-event self-test (#581)
        # Also merged and never run in CI. It pins the coupling that stops the
        # status board going stale behind the ledger, and the zero-padding fix
        # (item-4 vs item-04) WITHOUT which every item numbered 1..9 silently
        # failed to write - a bug the only pre-existing test could not catch
        # because it used item 20, a two-digit number.
        run: node --test scripts/tests/record-event.test.mjs

      - name: Setup Node.js 20 (restore pinned version for the rest of the job)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build shared package
        run: |
          rm -rf packages/shared/dist packages/shared/tsconfig.tsbuildinfo
          cd packages/shared && npx tsc
          test -f dist/db/schema.d.ts || (echo "FATAL: schema.d.ts not created!" && exit 1)

      - name: Scraper import smoke (real ESM runtime)
        # Loads the ENTIRE production import graph through the real entry
        # point, the same way pm2 runs it, then exits before any DB, network
        # or scrape work. Seconds of runtime. This is the only check in the
        # gate that evaluates production modules under the real module system.
        run: npx tsx src/index.ts --smoke-import
        working-directory: ./scraper

      - name: scraper vitest alias-table form (item 1 slice s14)
        # Evaluates scraper/vitest.config.ts and asserts the bare
        # @ipodhan/shared entry is an ANCHORED regex, not a string key. A
        # string key also captures @ipodhan/shared/db/schema and rewrites it
        # to <...>/index.ts/db/schema; reverting to the object form turns
        # both cases red.
        #
        # Runs here, AFTER npm ci and the Node 20 restore above, not with
        # the other dependency-free pre-install gates: it evaluates the
        # config via tsx (a scraper devDependency, works on Node 20 — unlike
        # node's --experimental-strip-types, which needs Node >= 22.6 and
        # was this check's original, CI-red implementation), so it needs
        # node_modules to exist first.
        run: node --test scripts/tests/scraper-vitest-alias-table.test.mjs

      - name: Run lint
        run: npm run lint:ci
        working-directory: ./web

      - name: Run type-check
        run: npx tsc --noEmit
        working-directory: ./web

      - name: Run unit tests
        run: npm run test:unit
        working-directory: ./web
        env:
          # Match ci.yml exactly. Same command with a different heap ceiling is
          # the same class of bug as the --no-isolate divergence #474 fixes: one
          # workflow could OOM on a suite the other passes. This repo has an OOM
          # history (PR #104 fixed a Next build OOM), so match UPWARD.
          NODE_OPTIONS: '--max-old-space-size=6144'

      - name: Type-check scraper scripts (T-433 MAJOR-4 - scraper/tsconfig.json only ever covered src/**)
        run: npm run type-check:scripts
        working-directory: ./scraper

      - name: Run shared package unit tests (T-433 MAJOR-5 - packages/shared test files had no runner)
        run: npx vitest run
        working-directory: ./packages/shared

      - name: "Run TZ-explicit case driver (issue #478)"
        # The TZ-explicit case file (tests/tz-cases/*.tzcase.test.ts) is
        # deliberately excluded from vitest.config.ts's own include glob
        # (vitest.tzcase.config.ts) and only ever meaningful when spawned by
        # this driver, which runs it once per timezone with TZ and
        # TZCASE_EXPECT_TZ set in the CHILD env (T-327F fix round 5 — see
        # the driver file's header for why an in-process TZ mutation cannot
        # work). The driver file is ALSO inside the full scraper unit suite
        # in the step below, and this step sits BEFORE it on purpose:
        # GitHub skips every later step once one fails, so a TZ regression
        # would redden the full suite first and leave this step grey - the
        # exact opposite of "identifiable at a glance". Running it first
        # costs ~5-10s and buys a named red step. It also gives a contract
        # one command to point at: running `vitest -c vitest.tzcase.config.ts`
        # directly does not merely fail, it self-spawns recursively (vitest
        # mergeConfig CONCATENATES include globs, so the config collects the
        # driver too) and never terminates.
        run: npm run test:tzcase
        working-directory: ./scraper

      - name: Run scraper unit test suite (full, T-301)
        # T-268C/T-268F originally added ONLY two targeted regression files
        # here because the scraper workspace carried a baseline of 44
        # unrelated failing tests (T-266) that a full-suite gate would have
        # turned red on unrelated debt. T-301 repaired every one of those 44
        # (root-caused per-file: stale field names post Story-11.8 segment/
        # offeringType migration, and two scrapers - chittorgarh, moneycontrol
        # - rewritten 2025-10-17 to API/Puppeteer-based fetching whose tests
        # still mocked the old Cheerio/HTML path) and this step now runs the
        # FULL scraper unit suite (all ~93 files) on every PR, no
        # failure-count allowlist. Measured locally: ~33s test/collect time
        # for 1115 tests across 93 files (T-301 evidence) - comfortably under
        # a 10-minute budget, no sharding needed.
        #
        # Deliberately still scoped to unit tests only (vitest.config.ts, not
        # vitest.integration.config.ts / vitest.e2e.config.ts /
        # vitest.load.config.ts) — those tiers need a real DB/Redis or a live
        # browser session and don't belong in this fast, always-on gate (see
        # .claude/rules/scraper-test-layout.md).
        run: npx vitest run --config vitest.config.ts
        working-directory: ./scraper

      - name: "Run pipeline stage harness (test ladder, issue #258)"
        # T-481: the stage-isolated harness implementing
        # docs/reviews/ipo-pipeline-stage-gap-analysis.md section 6 - one
        # fixture-in/expected-output-file-out test per pipeline stage. These
        # files are already inside the full scraper unit suite above; this
        # named step exists so a ladder regression is identifiable at a
        # glance in the gate (and so parts 2's stages 5-8 land in a step that
        # already exists). Runs only the offline arms - stage 0's live arm is
        # gated on STAGE0_DATABASE_URL, which CI never sets, so it skips
        # rather than fails. Seconds of runtime for two files.
        run: npx vitest run --config vitest.config.ts tests/unit/pipeline-stages
        working-directory: ./scraper

  python-tests:
    name: Scraper Python Extractor Tests (W-159)
    runs-on: ubuntu-latest
    # W-159: the scraper's python extractor guards (scraper/scripts/test_*.py,
    # ~110 tests covering the DRHP/RHP financial extraction path — memory
    # guard W-137, NUL-byte backstop W-138, cover-headline W-147, bounds
    # W-148) were never run by any CI workflow; the `gate` job above is
    # node-only. A regression here merged green until now. Kept as its own
    # job (not a step of `gate`) so it runs in parallel and a failure here is
    # attributed to the python suite, not the node one.
    #
    # Installs scraper/scripts/requirements-test.txt, NOT the full
    # requirements.txt + requirements-constraints.txt closure — that full
    # set exists to run OCR (rapidocr-onnxruntime + pypdfium2, W-112-pinned)
    # end-to-end on the VPS. `ocr_pages.py` imports those lazily inside
    # functions (never at module load), and every OCR-dependent test is
    # already skip-guarded via `ocr_pages.backend_available()` (W-57) when
    # the backend is absent, so the lighter install still exercises every
    # test that can run without native OCR wheels and skips the rest
    # honestly instead of installing heavy dependencies nothing here needs.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scraper/scripts/requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install -r scraper/scripts/requirements-test.txt

      - name: Run scraper python extractor test suite
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          # W-159 round 2: extract_filing.py installs the W-137 RLIMIT_AS
          # memory ceiling at MODULE import (memory_guard.install_memory_ceiling()),
          # which is real (not a no-op) on this ubuntu runner. "off" is the
          # one documented opt-out value (memory_guard.ceiling_disabled_by_env())
          # so collecting test_extract_filing_rupee_glyph.py does not pin the
          # pytest process itself to max_rss_mb(). Production default (unset)
          # is unaffected.
          EXTRACTOR_MEMORY_CEILING: 'off'
        run: python -m pytest scraper/scripts -q -rs -p no:cacheprovider

      - name: Board-owed-guard hook self-tests (project-level, 2026-09-25)
        # .claude/hooks/board-owed-guard.py moved from user level to project
        # level; this stdlib-only unittest suite (46 cases, ~8s) is its only
        # gate. Configures git identity because setUpClass does `git init` +
        # `git remote add` in temp dirs on this fresh runner. No extra pip
        # install (stdlib only, same Python 3.12 already set up above).
        env:
          BOARD_OWED_NO_REGEN: '1'
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          python .claude/hooks/tests/board-owed-guard.test.py

  # M-c: this job used to live in test.yml, which is workflow_dispatch-only —
  # so the gate that replays the journal from empty ran only when a human
  # remembered to click it. The two defects it exists to catch (0035's enum/table
  # name collision, the enum values stranded in an unapplied _repair/ file) are
  # both invisible to a schema that was built from a dump, which is every
  # environment except a fresh one. A gate nobody triggers is a gate.
  scraper-document-integration:
    name: Scraper Document Integration (T-403)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ipodhan_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build the shared package
        working-directory: ./packages/shared
        run: npx tsc

      - name: Replay the journal from empty
        # MIN-7: `drizzle-kit migrate`, not db:push - this job must prove the
        # JOURNAL can build the schema. A push would paper over exactly the
        # drift (the 0035 enum/table name collision, the missing document_type
        # values) that only a replay from empty exposes.
        working-directory: ./web
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ipodhan_test
        run: npx drizzle-kit migrate

      - name: Row-key coverage seeded DB proof (T-518)
        # scripts/tests/row-key-coverage.db.test.mjs was committed with NO CI
        # job invoking it — a check that exists and measures nothing. This is
        # the wire-up. The test's own before() hook would SKIP quietly if
        # DATABASE_URL were unset or unreachable (fine for a local run with no
        # DB), so the reachability assertion below runs FIRST and hard-fails
        # the step (non-zero exit under `set -e`) rather than letting the test
        # print a skip and go green with zero assertions — the exact failure
        # mode this item exists to close. Placed AFTER "Replay the journal
        # from empty" so promoters/ipo_intermediaries/peer_companies/
        # financial_statements/field_sources exist to seed into.
        working-directory: .
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ipodhan_test
        run: |
          node -e "
            const { Client } = require('pg');
            const c = new Client({ connectionString: process.env.DATABASE_URL, connectionTimeoutMillis: 5000 });
            c.connect()
              .then(() => c.query('SELECT current_database() AS db'))
              .then(({ rows }) => {
                if (!/_test\$/.test(rows[0].db)) throw new Error('refusing: current_database() is ' + rows[0].db + ', not a *_test database');
                console.log('row-key coverage DB check: reachable, current_database()=' + rows[0].db);
                return c.end();
              })
              .catch((e) => { console.error('row-key coverage DB unreachable - failing, not skipping:', e.message); process.exit(1); });
          "
          node --test scripts/tests/row-key-coverage.db.test.mjs

      - name: Assert schema drift (T-405 stage 0 — journal must rebuild the schema)
        # The journal-only rebuild above must match packages/shared/src/db/schema.ts.
        # SCHEMA_DRIFT_IGNORE_GATED=1 tolerates ONLY the exact, documented,
        # already-approved-elsewhere type-widenings in KNOWN_GATED_TYPE_DRIFT
        # (scripts/assert-schema-drift.ts) — destructive/type-changing DDL that
        # cannot be journaled (drizzle-migration-gated-ddl.md) and that prod
        # already carries via a historical out-of-band change. Any OTHER drift
        # still fails this step. deploy-linux.sh and the nightly audit call this
        # same script WITHOUT this env var, so they see (and fail on) the full,
        # unfiltered truth against their real environment.
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ipodhan_test
          SCHEMA_DRIFT_IGNORE_GATED: '1'
        run: npm run audit:schema-drift

      - name: Self-invalidate KNOWN_GATED_INDEX_DRIFT / KNOWN_GATED_UNIQUE_CONSTRAINT_DRIFT
        # scripts/tests/known-gated-registry-invalidation.test.ts — tsx, not
        # bare node --test, because it imports assert-schema-drift.ts through
        # the @ipodhan/shared/db/schema path alias. Fails the moment
        # schema.ts's declared columns for a gated entry stop matching that
        # entry's expectedColumns, so a stale suppression cannot silently
        # keep gating a drift that no longer exists.
        run: npx tsx --test scripts/tests/known-gated-registry-invalidation.test.ts

      - name: scripts/tests suite (#800 - files that existed and nothing ran)
        # Three of four scripts/tests/*.test.ts were named in NO workflow: they
        # existed, passed locally, and a regression in the script they cover would
        # have merged green. Found while fixing #794, where the consensus check
        # could only ever exit FATAL and no test caught it - because the tests were
        # never run.
        #
        # tsx, not bare `node --test`: these are TypeScript and import through the
        # @ipodhan/shared path alias. Bare node gives "Cannot use import statement
        # outside a module", which reads as a broken test rather than a wrong runner.
        #
        # assert-schema-drift.test.ts is deliberately NOT here: it refuses without a
        # live DATABASE_URL ("FATAL: set DATABASE_URL or TEST_DATABASE_URL to a
        # throwaway scratch Postgres"). It belongs in a job that provisions a
        # database, not this one - adding it here would make the gate red on every
        # PR, which is how a gate gets ignored. Tracked in #800.
        run: |
          npx tsx --test scripts/tests/audit-consensus-verdict.test.ts
          npx tsx --test scripts/tests/known-gated-type-drift.test.ts

      - name: Run the document-state integration tests
        # THIS LIST IS GATED. Every file under scraper/tests/integration/ must
        # appear here or in scripts/ci/integration-test-exclusions.json with a
        # reason; scripts/ci/require-integration-test-coverage.mjs (job
        # integration-coverage-gate below) parses THIS command and fails the PR
        # on anything in neither. Adding a test file and forgetting this line is
        # the class that issue #507 keeps recurring as.
        working-directory: ./scraper
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ipodhan_test
          REDIS_URL: redis://localhost:6379
        run: >-
          npx vitest run -c vitest.integration.config.ts
          tests/integration/document-fetch-state-repository.integration.test.ts
          tests/integration/child-table-normalized-name.integration.test.ts
          tests/integration/child-table-row-key-unique-constraint.integration.test.ts
          tests/integration/child-row-consolidation-financials.integration.test.ts
          tests/integration/incapable-source-refusal.integration.test.ts
          tests/integration/ipos-lineage-document-id.integration.test.ts
          tests/integration/repair-ipos-lineage-document-id.integration.test.ts
          tests/integration/peer-company-replace-atomicity.integration.test.ts
          tests/integration/field-sources-row-key-provenance.integration.test.ts
          tests/integration/field-sources-row-key-unique.integration.test.ts
          tests/integration/ipo-field-plan-row-key-unique.integration.test.ts
          tests/integration/ipo-field-plan-repository.integration.test.ts
          tests/integration/live-slot-miss-monitor.integration.test.ts
          tests/integration/field-source-overrides-repository.integration.test.ts
          tests/integration/field-plan-walk-resume.integration.test.ts
          tests/integration/field-plan-walk-reclaim-starvation.integration.test.ts
          tests/integration/field-plan-generation-wiring.integration.test.ts
          tests/integration/field-plan-walk-real-writer.integration.test.ts
          tests/integration/field-plan-walk-verdict-writer.integration.test.ts
          tests/integration/field-plan-walk-reason-codes.integration.test.ts
          tests/integration/closed-ipo-job-plan-then-walk.integration.test.ts
          tests/integration/normalizer-sql-agreement.integration.test.ts
          tests/integration/derived-key-recompute-guard.integration.test.ts
          tests/integration/alternative-sources.integration.test.ts
          tests/integration/corrigendum-suggestions.integration.test.ts
          tests/integration/merge-unmerge-roundtrip.integration.test.ts
          tests/integration/document-field-receipts.integration.test.ts
          tests/integration/ocr-loses-disagreement.integration.test.ts
          tests/integration/settled-field-override-reopen.integration.test.ts
          tests/integration/data-conflicts-repository-hold.integration.test.ts
          tests/integration/od73-settled-field.integration.test.ts
          tests/integration/db-timezone.integration.test.ts
          tests/integration/field-sources-witnesses.integration.test.ts
          tests/integration/duplicate-ipo-merge.integration.test.ts
          tests/integration/merge-repoint-conflict.integration.test.ts
          tests/integration/nse-scraper.integration.test.ts
          tests/integration/identity-matching-od68.integration.test.ts
          tests/integration/source-record-keys-od85.integration.test.ts
          tests/integration/repair-issue-size-od74.integration.test.ts
          tests/integration/repair-reopen-stale-doc-nay.integration.test.ts
          tests/integration/oracle-parity.test.ts
          tests/integration/opening-day-create.integration.test.ts
          tests/integration/post-listing-price.integration.test.ts
          tests/integration/repair-bse-subscription-ist-shift.integration.test.ts

  # W-169 round 2: nothing in CI ran scripts/tests/deploy-linux.test.sh —
  # pr-gate's `gate` job only runs the two node self-tests under
  # scripts/tests, never the deploy-script bash suites. That suite covers
  # W-136/W-136b/W-169 (probe process-group + PROBE_PORT listener cleanup)
  # and previously ran ONLY on a developer's own machine, where `ss`,
  # `fuser` and real process-group semantics are not guaranteed (the W-169
  # round-1 harness had to skip-guard one case for exactly that reason on
  # Windows/Git-Bash). ubuntu-latest has ss/fuser/setsid for real, so this
  # job proves the fake-root harness (and the escalation logic it drives)
  # against a genuine Linux host, independent of every other job here.
  deploy-script-tests:
    name: Deploy Script Tests (W-136/W-136b/W-169)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run deploy-linux.sh test suite
        run: |
          set -o pipefail
          bash scripts/tests/deploy-linux.test.sh 2>&1 | tee /tmp/deploy-linux-test.log
          echo "--- tail ---"
          tail -n 40 /tmp/deploy-linux-test.log

      - name: Run require-release-branch test suite
        run: bash scripts/deploy/tests/require-release-branch.test.sh

      # Issue #656: the rollout-flag liveness gate (assert_rollout_flags_live,
      # T-297 D9 / #193) is what refuses a deploy when a `// LIVE-GATE`
      # percentage is 0 or a `// PROD-REQUIRED-TRUE` flag is not literally
      # 'true' -- the T-282 class where CONSOLIDATION_PERCENTAGE=0 silently
      # voids the whole consolidation pipeline and every downstream reading
      # is a clean-looking zero. The guard and its cases have existed since
      # #352 (hardened over four T-467 rounds), but NOTHING in CI ran them:
      # the `gate` job runs only the node self-tests under scripts/tests, and
      # this job named the two deploy bash suites individually without this
      # one. An unrun suite is not coverage -- a revert of the guard would
      # have gone green. Named explicitly because pr-gate never globs.
      - name: "Run assert-env-keys test suite (rollout-flag liveness gate, #656)"
        run: bash scripts/tests/assert-env-keys.test.sh

      # Slice s17: deploy-linux.yml no longer triggers on push; staging is
      # deployed by a 15-minute poll that fires only when main's head differs
      # from the sha staging serves. Both ways that gate can break are silent
      # - it never deploys again, or it deploys every tick - so its branches
      # are pinned here. The suite extracts the gate's own `run:` body out of
      # deploy-linux.yml and executes it, so an edit to the workflow is what
      # it sees; it needs no npm install (no YAML library) and never contacts
      # the real box (curl is stubbed, git history is a mktemp repo).
      - name: Run staging-cadence gate test suite
        run: bash scripts/tests/deploy-linux-schedule-gate.test.sh

      # 2026-09-16 (owner standing rule "staging deploys in windows, not per
      # merge"): the cron timer that replaced the removed push/schedule
      # triggers, the manual button that replaced "just dispatch it", and the
      # deploy-linux.sh cron-install idempotency they both depend on. Named
      # explicitly, same as every other suite in this job - pr-gate never globs.
      - name: Run staging window cron install test suite (deploy-linux.sh)
        run: bash scripts/tests/staging-window-cron.test.sh

      - name: Run staging window deploy script test suite (VPS cron payload)
        run: bash scripts/tests/staging-window-deploy.test.sh

      - name: Run staging-now manual button test suite (capped 2/day)
        run: bash scripts/tests/deploy-staging-now.test.sh

      - name: Run config-only deploy test suite (item 3 S5)
        run: bash scripts/tests/deploy-config.test.sh

      - name: Run config-only deploy release-link test suite (item 3 S5, symlink-only on Linux)
        run: bash scripts/tests/deploy-linux-config-link.test.sh

      # #793: the config-link suite above proves the SYMLINK is built; this one
      # proves a deploy REFUSES when the file behind that link does not satisfy
      # the schema the same deploy just shipped. On 2026-09-19 that combination
      # killed the staging scraper for six hours while the deploy reported
      # success, so the gate is only worth having if it is run.
      - name: Run deployed-config preflight test suite (#793 M1)
        run: bash scripts/tests/deploy-linux-config-preflight.test.sh

      # #793 M2: the consumer for the wake log. 18 wake-failed lines sat unread
      # in /var/log/ipodhan-scraper-wake-staging.log during that outage.
      - name: Run wake-log delta test suite (#793 M2, signal-ownership R3)
        run: node --test scripts/tests/wake-delta.test.mjs

      # #793 M3: the lineage check that runs OUTSIDE the scraper. The in-cycle
      # copy cannot fire on this incident - it lives in main(), which the config
      # refusal kills before it is reached.
      - name: Run config/code lineage test suite (#793 M3)
        run: node --test scripts/tests/config-lineage.test.mjs

      # Item 7 slice 1: scripts/scraper-wake.sh replaced pm2's --cron-restart,
      # which was the only thing bounding a hung scraper on prod. Both of the
      # wrapper's guards fail SILENTLY - a lock-skip that stops printing its
      # reason line looks exactly like a wake that never fired, and a ceiling
      # that stops firing looks exactly like a job still working. Neither
      # announces itself, so every branch is pinned and this job is where they
      # run. ubuntu-latest is also the only place the suite's real `timeout`
      # and `dash` assertions are meaningful (the deploy host runs the wrapper
      # under /bin/sh, not bash).
      #
      # Mutation-proof (2026-09-16): seven mutations - the lock check, the
      # ceiling value, the skip-exit path, the external timeout supervisor, and
      # the deploy script's --cron-restart / --no-autorestart / wrapper-vs-tsx
      # pm2 flags - were each applied with the needle asserted to match exactly
      # once, and all seven turned this suite red.
      - name: Run scraper wake-wrapper test suite (lock-skip + 2h ceiling)
        run: bash scripts/tests/scraper-wake.test.sh

  # Recurrence loop, part 1 (2026-09-06): the "share count stored as issue
  # size" class was fixed on one write path in August and recurred on
  # another write path in September with no check to catch it. This job
  # refuses a scraper/persister-touching PR that adds no detection check and
  # carries no explicit declaration of why not. See
  # docs/reviews/failure-classes.md for the registry, and
  # scripts/ci/require-detection-change.mjs for the exact trigger/exempt
  # globs and the declaration format.
  detection-change-gate:
    name: Detection-Change Gate (recurrence loop pt.1)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detection-change gate self-test
        run: node --test scripts/ci/tests/require-detection-change.test.mjs

      - name: Detection registry generator self-test (T-487)
        run: node --test scripts/tests/build-detection-registry.test.mjs

      - name: Detection registry parity vs origin/main (T-487 round 2)
        run: node --test scripts/tests/build-detection-registry-parity.test.mjs

      - name: Detection registry aggregates not stale (T-487)
        # One file per check/failure-class under docs/reviews/detection-checks/
        # and docs/reviews/failure-classes/ is the source of truth; the
        # committed detection-checks.json and the generated table in
        # failure-classes.md are build products every existing reader still
        # depends on. This fails the PR if someone edited a per-entry file
        # without re-running the generator, or hand-edited an aggregate.
        run: node scripts/build-detection-registry.mjs --check

      - name: Plan board generator self-test
        run: node --test scripts/tests/build-plan-board.test.mjs

      - name: Plan board sections not stale
        # docs/design/board/plan-sections.generated.html is a BUILD PRODUCT of
        # three sources: the completion-state markdown, the spec's OD rows and
        # the field manifest. The owner reads the published board to see what is
        # left before staging is feature-complete, so a stale generated file is
        # a status page that lies. This fails the PR if a source moved and the
        # generator was not re-run. Wired here rather than left as a local
        # convenience: 28 of 51 files under scripts/tests/ are not named by any
        # workflow (#616), so an unwired check is a check that does not run.
        run: node scripts/ops/build-plan-board.mjs --check

      - name: Board renderer self-test
        run: node scripts/tests/render-board.test.mjs

      - name: Rendered board not stale
        # docs/design/board/index.html is the file that gets PUBLISHED to the
        # owner-facing board URL. It is a build product of board-data.json,
        # status.json, board-prose.json and the generated tracking sections.
        # This fails the PR if someone edited the data and never re-rendered,
        # which would publish a page whose numbers disagree with its own
        # sources -- the exact drift measured on 2026-09-20 (the page said
        # "12 built" while the source said 16).
        run: node scripts/ops/render-board.mjs --check

      - name: Run detection-change gate
        env:
          GH_PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/require-detection-change.mjs origin/${{ github.base_ref }} HEAD

  # Item 1 slice s11 (issue #507, recurring 2026-09-11): the
  # scraper-document-integration job named the files it runs on a
  # hand-maintained line, and nothing compared that line to the files on disk.
  # Three integration test files were added and never executed once; a green
  # pr-gate said nothing at all about them. This job enumerates the files,
  # parses that job's own run command, subtracts an exclusion file in which
  # every entry carries a reason, and fails naming anything left over. No npm
  # install, no database, no network - it is seconds, and it runs on every PR.
  integration-coverage-gate:
    name: Integration-Test Coverage Gate (#507)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Coverage-gate self-test
        run: node --test scripts/tests/require-integration-test-coverage.test.mjs

      - name: Every scraper integration test is run by CI or excluded with a reason
        run: node scripts/ci/require-integration-test-coverage.mjs

  # The real `next build` (webpack pass), path-filtered so it only runs when
  # web/** or packages/shared/** actually changed. Neither the `gate` job's
  # `tsc --noEmit`/lint/unit-test steps nor `check-shared-js-imports-resolve.mjs`
  # runs webpack, so the class "web build breaks while pr-gate stays green" was
  # only PARTLY guarded until this job existed: the fast check catches an
  # unresolvable `.js` import, but the 2026-09-24 incident's SECOND failure (a
  # pre-existing type error in packages/shared that `next build`'s type-check
  # step reached only after module resolution succeeded) is a class the fast
  # check structurally cannot see. Public repo, GitHub-hosted minutes are free,
  # so there is no billing reason to keep skipping the real build.
  web-build:
    name: Web production build (next build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether web/** or packages/shared/** changed
        id: filter
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          if git diff --name-only "$BASE" "$HEAD" | grep -qE '^(web/|packages/shared/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js 20
        if: steps.filter.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        if: steps.filter.outputs.run == 'true'
        run: npm ci

      - name: Build shared package
        if: steps.filter.outputs.run == 'true'
        run: |
          rm -rf packages/shared/dist packages/shared/tsconfig.tsbuildinfo
          cd packages/shared && npx tsc

      - name: Shared .js-suffixed imports resolve under webpack too (fast pre-check)
        if: steps.filter.outputs.run == 'true'
        run: node scripts/ci/check-shared-js-imports-resolve.mjs

      - name: next build
        # No Sentry/DB/Redis env vars set — the local proof run (2026-09-24)
        # succeeded with none of them set either (withSentryConfig no-ops
        # without SENTRY_ORG/SENTRY_AUTH_TOKEN; the app's build-time code
        # tolerates their absence). If a future change makes the build
        # require one, add it here as the same dummy value local runs use,
        # never a real secret.
        if: steps.filter.outputs.run == 'true'
        working-directory: ./web
        run: npm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=6144'
