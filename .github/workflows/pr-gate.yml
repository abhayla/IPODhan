name: PR Gate

# Minimal, always-on check for every PR into main. Deliberately narrow (lint +
# type-check + unit tests only, no E2E/Lighthouse) so it stays fast and cheap
# on GitHub-hosted minutes — ci.yml/test.yml run the full suite but are
# manual-only (workflow_dispatch) after a prior billing block from running the
# heavy suite on every push/PR. This is the check to require once branch
# protection / required status checks are available (private free-plan repos
# don't support them yet).

on:
  pull_request:
    branches: [main]
    # Docs-only PRs don't need lint/type-check/unit tests to burn Actions minutes.
    # Checked for runtime coupling first (T-190): grepped web/tests, scraper/tests,
    # scraper/src/tests for any readFileSync/fs.readFile/require of a docs/*.md
    # path. Only hit was a code COMMENT (not a runtime read) in
    # scraper/tests/unit/index-listing-performance-wiring.test.ts referencing
    # docs/monitoring/scrape-cadence-measurement.md — no negation entry needed.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

# No main-branch guard needed here (T-190 review): this workflow only triggers
# on `pull_request`, never on `push` to main, and the group is scoped per PR
# number — so cancel-in-progress can never cancel a run tied to main.
concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: Lint, Type-check & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: |
          rm -rf packages/shared/dist packages/shared/tsconfig.tsbuildinfo
          cd packages/shared && npx tsc
          test -f dist/db/schema.d.ts || (echo "FATAL: schema.d.ts not created!" && exit 1)

      - name: Run lint
        run: npm run lint
        working-directory: ./web

      - name: Run type-check
        run: npx tsc --noEmit
        working-directory: ./web

      - name: Run unit tests
        run: npm run test:unit
        working-directory: ./web

      - name: Run scraper targeted regression tests
        # T-268C/T-268F: this job previously ran ONLY web tests, so the scraper
        # workspace had zero automatic PR coverage. That let packages/shared's
        # `exports` map drop two subpaths scraper entrypoints import
        # (@ipodhan/shared/cache/redis-client,
        # @ipodhan/shared/repositories/listing-performance-repository) without
        # any CI signal — vitest's own resolver couldn't have caught it either
        # (scraper/vitest.config.ts aliases those subpaths straight to source
        # for test-resolution), which is why this test spawns a real tsx child
        # process instead of relying on vitest's resolver.
        #
        # Scoped to this one file, not the full scraper suite: the scraper
        # workspace carries a pre-existing baseline of 43 unrelated failing
        # tests (T-266, tracked separately) that this PR does not touch and is
        # not the place to fix; running the full suite here would turn every
        # future PR red on unrelated debt. Widen this to the full suite only
        # once that baseline is cleaned up.
        # T-270 adds nse-past-issue-matcher.test.ts here: the price-band
        # backfill's old fuzzy name matcher wrote wrong bands into 80 live
        # prod rows, and nothing in CI could have caught it.
        run: npx vitest run --config vitest.config.ts tests/unit/module-resolution/shared-package-exports-real-esm.test.ts tests/unit/services/nse-past-issue-matcher.test.ts
        working-directory: ./scraper
