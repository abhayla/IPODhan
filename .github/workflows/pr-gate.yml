name: PR Gate

# Minimal, always-on check for every PR into main. Deliberately narrow (lint +
# type-check + unit tests only, no E2E/Lighthouse) so it stays fast and cheap
# on GitHub-hosted minutes — ci.yml/test.yml run the full suite but are
# manual-only (workflow_dispatch) after a prior billing block from running the
# heavy suite on every push/PR. This is the check to require once branch
# protection / required status checks are available (private free-plan repos
# don't support them yet).

on:
  pull_request:
    branches: [main]
    # Docs-only PRs don't need lint/type-check/unit tests to burn Actions minutes.
    # Checked for runtime coupling first (T-190): grepped web/tests, scraper/tests,
    # scraper/src/tests for any readFileSync/fs.readFile/require of a docs/*.md
    # path. Only hit was a code COMMENT (not a runtime read) in
    # scraper/tests/unit/index-listing-performance-wiring.test.ts referencing
    # docs/monitoring/scrape-cadence-measurement.md — no negation entry needed.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

# No main-branch guard needed here (T-190 review): this workflow only triggers
# on `pull_request`, never on `push` to main, and the group is scoped per PR
# number — so cancel-in-progress can never cancel a run tied to main.
concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: Lint, Type-check & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Write-ratchet self-test (T-316)
        # Mutation-proof: scripts/tests/check-write-ratchet.test.mjs imports
        # the actual PATTERNS from the script under test, so a deleted
        # pattern turns this red before the ratchet check below can silently
        # stop catching that pattern class. No deps needed (Node builtins only).
        run: node --test scripts/tests/check-write-ratchet.test.mjs

      - name: Detection-floor checks self-test (T-335)
        # Mutation-proof: scripts/tests/audit-detection-floor.test.mjs imports
        # the actual predicates from scripts/lib/detection-floor-checks.mjs
        # (the round-7 fresh-review coverage floor promoted to FAIL-level
        # nightly checks), so weakening/deleting a predicate turns this red
        # before it can silently stop catching that finding class again. No
        # deps needed (Node builtins only).
        run: node --test scripts/tests/audit-detection-floor.test.mjs

      - name: VPS runtime preflight self-test (T-406)
        # Drives the real scripts/preflight-runtime.sh as a subprocess with
        # fake python3/tesseract/node shims + controlled env, so a weakened
        # or deleted check turns this red. No deps needed (Node builtins +
        # bash, both present on ubuntu-latest).
        run: node --test scripts/tests/preflight-runtime.test.mjs

      - name: Document-state check self-tests (T-403)
        # Mutation-proof: scripts/tests/document-state-checks.test.mjs imports
        # the real predicates from scripts/lib/document-state-checks.mjs, so
        # weakening or deleting one of the five nightly document checks turns
        # its fixture red here rather than silently disarming the audit.
        run: node --test scripts/tests/document-state-checks.test.mjs

      - name: Write ratchet — no new direct `ipos` writers (T-316/R0)
        # Grep-based gate, not ESLint (T-313C amendment): catches raw .sql/.mjs
        # writers and the runtime-resolved dynamic-table admin route that a
        # syntax-aware lint rule cannot see. Baseline is shrink-only —
        # config/write-ratchet-baseline.json. See
        # docs/architecture/write-path-hardening.md ("R0").
        run: node scripts/check-write-ratchet.mjs

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: |
          rm -rf packages/shared/dist packages/shared/tsconfig.tsbuildinfo
          cd packages/shared && npx tsc
          test -f dist/db/schema.d.ts || (echo "FATAL: schema.d.ts not created!" && exit 1)

      - name: Run lint
        run: npm run lint:ci
        working-directory: ./web

      - name: Run type-check
        run: npx tsc --noEmit
        working-directory: ./web

      - name: Run unit tests
        run: npm run test:unit
        working-directory: ./web

      - name: Run scraper unit test suite (full, T-301)
        # T-268C/T-268F originally added ONLY two targeted regression files
        # here because the scraper workspace carried a baseline of 44
        # unrelated failing tests (T-266) that a full-suite gate would have
        # turned red on unrelated debt. T-301 repaired every one of those 44
        # (root-caused per-file: stale field names post Story-11.8 segment/
        # offeringType migration, and two scrapers - chittorgarh, moneycontrol
        # - rewritten 2025-10-17 to API/Puppeteer-based fetching whose tests
        # still mocked the old Cheerio/HTML path) and this step now runs the
        # FULL scraper unit suite (all ~93 files) on every PR, no
        # failure-count allowlist. Measured locally: ~33s test/collect time
        # for 1115 tests across 93 files (T-301 evidence) - comfortably under
        # a 10-minute budget, no sharding needed.
        #
        # Deliberately still scoped to unit tests only (vitest.config.ts, not
        # vitest.integration.config.ts / vitest.e2e.config.ts /
        # vitest.load.config.ts) — those tiers need a real DB/Redis or a live
        # browser session and don't belong in this fast, always-on gate (see
        # .claude/rules/scraper-test-layout.md).
        run: npx vitest run --config vitest.config.ts
        working-directory: ./scraper
