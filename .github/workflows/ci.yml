name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: |
          echo "=== Debug: Check typescript availability ==="
          npx tsc --version
          echo "=== Debug: Check shared package ==="
          ls -la packages/shared/
          cat packages/shared/package.json
          echo "=== Debug: Check tsconfig ==="
          cat packages/shared/tsconfig.json
          echo "=== Debug: Remove any stale build artifacts ==="
          rm -rf packages/shared/dist packages/shared/tsconfig.tsbuildinfo
          echo "=== Building shared package ==="
          cd packages/shared && npx tsc --diagnostics
          echo "=== Verify the build succeeded ==="
          ls -la dist/ || echo "ERROR: dist folder not created!"
          ls -la dist/db/ || echo "ERROR: dist/db folder not created!"
          test -f dist/db/schema.d.ts || (echo "FATAL: schema.d.ts not created!" && exit 1)

      - name: Run lint
        run: npm run lint
        working-directory: ./web

      - name: Run type-check
        run: npx tsc --noEmit
        working-directory: ./web

      - name: Run unit tests
        run: npx vitest run --reporter=basic --no-isolate
        working-directory: ./web
        env:
          NODE_OPTIONS: '--max-old-space-size=6144'

      - name: Install Playwright browsers
        run: npx playwright install --with-deps
        working-directory: ./web

      - name: Run E2E tests
        run: npm run test:e2e
        working-directory: ./web

      - name: Build
        run: npm run build
        working-directory: ./web

      - name: Run Lighthouse CI Performance Tests
        run: |
          npm install -g @lhci/cli@latest
          lhci autorun || echo "::warning::Lighthouse CI failed but continuing build"
        working-directory: ./web
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: .lighthouseci/
          retention-days: 7

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: web/test-results/
          retention-days: 7

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
