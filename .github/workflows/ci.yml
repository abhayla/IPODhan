name: CI

on:
  # Manual-only by choice: do NOT auto-run on push / PR / merge — that consumed
  # GitHub-hosted Actions minutes on every change and tripped the account billing
  # block. Trigger from the Actions tab ("Run workflow") when you want a CI pass.
  # Deploy-time quality gates still run inside deploy.yml.
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Item 1 slice s3b (clause-8 CI hardening): web unit/E2E steps below no
      # longer carry continue-on-error, so a web integration-test step needs a
      # real database to run against. Pattern copied from pr-gate.yml's
      # scraper-document-integration job (postgres:16 + drizzle-kit migrate,
      # never db:push) rather than invented fresh.
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ipodhan_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: |
          rm -rf packages/shared/dist packages/shared/tsconfig.tsbuildinfo
          cd packages/shared && npx tsc
          test -f dist/db/schema.d.ts || (echo "FATAL: schema.d.ts not created!" && exit 1)

      - name: Run lint
        run: npm run lint:ci
        working-directory: ./web

      - name: Run type-check
        run: npx tsc --noEmit
        working-directory: ./web

      - name: Run unit tests
        # 2026-09-10: run EXACTLY what pr-gate runs. This step previously used a raw
        # `npx vitest run --no-isolate`, which shares one worker across every test file;
        # something in the suite tears `window` down for its successors, so 90 of 187
        # files failed. Measured on the same files minutes apart: with --no-isolate
        # 664 failed / 483 passed; without it 4 failed / 1143 passed. continue-on-error
        # hid this until #464 removed it. One suite, one command.
        run: npm run test:unit
        working-directory: ./web
        env:
          NODE_OPTIONS: '--max-old-space-size=6144'

      - name: Replay the journal from empty (item 1 slice s3b)
        # Same shape as pr-gate.yml's scraper-document-integration job: prove
        # the JOURNAL builds the schema, never db:push (that would paper over
        # drift a replay-from-empty is specifically meant to expose).
        working-directory: ./web
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ipodhan_test
        run: npx drizzle-kit migrate

      - name: Run integration tests
        run: npm run test:integration
        working-directory: ./web
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ipodhan_test
          REDIS_URL: redis://localhost:6379

      - name: Install Playwright browsers
        run: npx playwright install --with-deps
        working-directory: ./web

      - name: Run E2E tests
        run: npm run test:e2e
        working-directory: ./web
        env:
          REDIS_URL: redis://localhost:6379

      - name: Build
        run: npm run build
        working-directory: ./web

      - name: Run Lighthouse CI Performance Tests
        run: |
          npm install -g @lhci/cli@latest
          lhci autorun || echo "::warning::Lighthouse CI failed but continuing build"
        working-directory: ./web
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: .lighthouseci/
          retention-days: 3
        continue-on-error: true  # Don't fail if storage quota exceeded

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: web/test-results/
          retention-days: 3
        continue-on-error: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 3
        continue-on-error: true
