name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: |
          rm -rf packages/shared/dist packages/shared/tsconfig.tsbuildinfo
          cd packages/shared && npx tsc
          test -f dist/db/schema.d.ts || (echo "FATAL: schema.d.ts not created!" && exit 1)

      - name: Run lint
        run: npm run lint
        working-directory: ./web

      - name: Run type-check
        run: npx tsc --noEmit
        working-directory: ./web

      - name: Run unit tests
        run: npx vitest run --reporter=basic --no-isolate
        working-directory: ./web
        continue-on-error: true  # TODO: Fix Redis mocking in tests
        env:
          NODE_OPTIONS: '--max-old-space-size=6144'

      - name: Install Playwright browsers
        run: npx playwright install --with-deps
        working-directory: ./web

      - name: Run E2E tests
        run: npm run test:e2e
        working-directory: ./web
        continue-on-error: true  # E2E tests require database - run in staging environment
        env:
          REDIS_URL: redis://localhost:6379

      - name: Build
        run: npm run build
        working-directory: ./web

      - name: Run Lighthouse CI Performance Tests
        run: |
          npm install -g @lhci/cli@latest
          lhci autorun || echo "::warning::Lighthouse CI failed but continuing build"
        working-directory: ./web
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: .lighthouseci/
          retention-days: 3
        continue-on-error: true  # Don't fail if storage quota exceeded

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: web/test-results/
          retention-days: 3
        continue-on-error: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 3
        continue-on-error: true
