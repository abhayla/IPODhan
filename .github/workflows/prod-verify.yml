name: Production Verification

# Browser-level correctness sweep of every public route: no client error,
# zero console errors, no failed same-origin requests, real content rendered.
# Catches what HTTP-200 checks miss (blank pages, broken client fetches,
# hydration errors). Run on demand or on a schedule.

on:
  # Manual-only by choice: the daily schedule was removed so it no longer consumes
  # GitHub-hosted Actions minutes automatically. Run it from the Actions tab after a
  # deploy (or whenever you want to sweep the live site).
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Target base URL'
        required: false
        default: 'https://ipodhan.com'

concurrency:
  group: prod-verify
  cancel-in-progress: true

jobs:
  verify:
    name: Verify every page (browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install deps + chromium
        working-directory: ./web
        run: |
          npm ci --production=false
          npx playwright install --with-deps chromium
      - name: Run production verification
        working-directory: ./web
        env:
          PROD_BASE_URL: ${{ inputs.base_url || 'https://ipodhan.com' }}
        run: npm run test:prod-verify
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-verify-report
          path: web/playwright-report/
          retention-days: 7
