name: Production Verification

# Browser-level correctness sweep of every public route: no client error,
# zero console errors, no failed same-origin requests, real content rendered.
# Catches what HTTP-200 checks miss (blank pages, broken client fetches,
# hydration errors). Run on demand or on a schedule.

on:
  # Manual-only by choice: the daily `schedule:` was removed (commit b5011df5) so
  # this no longer consumes GitHub-hosted Actions minutes automatically. Run it
  # from the Actions tab after a deploy (or whenever you want to sweep the live
  # site) — PR Gate (ci.yml/test.yml) still runs per-PR unit coverage regardless.
  #
  # T-294 (2026-08-23): this gap left the live-site browser sweep unmonitored
  # for 53 days (last scheduled run 2026-07-01) and GitHub Actions billing on
  # this account is ALSO separately broken until 2026-09-01, so re-adding a GH
  # `schedule:` here is not viable right now either way. The interim fix is a
  # daily cron running the SAME spec (web/tests/e2e/production-verification.spec.ts)
  # directly on the Linux VPS that serves ipodhan.com (72.61.240.224), via
  # scripts/vps-prod-verify-cron.sh, at 03:15 IST daily, alerting through the
  # Notifier gateway (project "ipodhan") on any failure. See that script's
  # header for the exact revert steps once Actions billing resumes — in short:
  # add a `schedule:` block back here, then remove the VPS crontab line.
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Target base URL'
        required: false
        default: 'https://ipodhan.com'

concurrency:
  group: prod-verify
  cancel-in-progress: true

jobs:
  verify:
    name: Verify every page (browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install deps + chromium
        working-directory: ./web
        run: |
          # --ignore-scripts skips the root `prepare: husky` hook, which fails on
          # CI runners (exit 127, no git-hook context). Chromium is installed
          # explicitly on the next line, so nothing is lost.
          npm ci --production=false --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Run production verification
        working-directory: ./web
        env:
          PROD_BASE_URL: ${{ inputs.base_url || 'https://ipodhan.com' }}
        run: npm run test:prod-verify
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-verify-report
          path: web/playwright-report/
          retention-days: 7
