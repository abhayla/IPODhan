name: VPS Setup SSH (one-time maintenance)

# Installs OpenSSH Server on the production VPS via the self-hosted runner,
# authorizes a single public key (key-only auth; password login disabled),
# and opens the firewall for port 22. Contains no secrets — only a public key.

on:
  workflow_dispatch:

jobs:
  setup-ssh:
    runs-on: self-hosted

    steps:
      - name: Install and configure OpenSSH Server
        shell: powershell
        run: |
          Write-Host "[INFO] Running as: $(whoami)"

          $cap = Get-WindowsCapability -Online -Name 'OpenSSH.Server~~~~0.0.1.0'
          if ($cap.State -ne 'Installed') {
            Write-Host "[INFO] Installing OpenSSH Server capability..."
            Add-WindowsCapability -Online -Name 'OpenSSH.Server~~~~0.0.1.0'
          } else {
            Write-Host "[OK] OpenSSH Server already installed"
          }

          Set-Service -Name sshd -StartupType Automatic
          if ((Get-Service sshd).Status -ne 'Running') { Start-Service sshd }

          if (-not (Get-NetFirewallRule -Name 'sshd-inbound' -ErrorAction SilentlyContinue)) {
            New-NetFirewallRule -Name 'sshd-inbound' -DisplayName 'OpenSSH Server (sshd)' `
              -Enabled True -Direction Inbound -Protocol TCP -Action Allow -LocalPort 22 | Out-Null
            Write-Host "[OK] Firewall rule created for port 22"
          } else {
            Write-Host "[OK] Firewall rule already exists"
          }

          # Authorize the audit key for administrators (key-only access)
          $pub = 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIjL3g7k3olppYy2D/ipDU/Eb4pLiGf5HUcih5+bGM8O ipodhan-claude-audit'
          $authFile = 'C:\ProgramData\ssh\administrators_authorized_keys'
          Set-Content -Path $authFile -Value $pub -Encoding ascii
          icacls $authFile /inheritance:r /grant 'Administrators:F' /grant 'SYSTEM:F'
          Write-Host "[OK] administrators_authorized_keys written with restricted ACL"

          # Disable password authentication — key-only
          $cfg = 'C:\ProgramData\ssh\sshd_config'
          $content = Get-Content $cfg
          if ($content -match '^#?PasswordAuthentication') {
            $content = $content -replace '^#?PasswordAuthentication.*', 'PasswordAuthentication no'
          } else {
            $content += 'PasswordAuthentication no'
          }
          Set-Content -Path $cfg -Value $content
          Restart-Service sshd
          Write-Host "[OK] Password authentication disabled; sshd restarted"

          # Default shell -> PowerShell for usable remote commands
          New-ItemProperty -Path 'HKLM:\SOFTWARE\OpenSSH' -Name DefaultShell `
            -Value 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe' -PropertyType String -Force | Out-Null

          Get-Service sshd | Format-List Name, Status, StartType
          Write-Host "[DONE] SSH ready. Connect as the user shown above with the authorized key."
