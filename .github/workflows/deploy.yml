name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests (emergency deployment only)'
        required: false
        type: boolean
        default: false
      checks_verified_locally:
        # Exists because private-repo GitHub Actions minutes run out most months
        # (shared 2000 min/mo quota across all repos on the account) and every
        # ubuntu-latest job then fails to START - including quality-checks,
        # which gates this deploy. Self-hosted runners (the deploy job below)
        # are unaffected: they run on the owner's own VPS and cost zero minutes.
        # This input does NOT skip testing - it moves the test run from the
        # hosted job to the self-hosted deploy job (see "Re-run quality checks
        # on self-hosted runner" step below), so the free half of the pipeline
        # is never held hostage by the paid half. Default is FALSE: the strict,
        # today's-behavior path is still what you get by doing nothing.
        description: 'Quality checks verified locally elsewhere (e.g. hosted-runner minutes exhausted) - skips the hosted quality-checks job; deploy job re-runs the full check suite on the self-hosted runner before touching any files. Requires local_verification_evidence.'
        required: false
        type: boolean
        default: false
      local_verification_evidence:
        description: 'Required when checks_verified_locally=true: what was verified and where (command output summary, or a commit SHA + pass/fail result line)'
        required: false
        type: string
        default: ''

# Only one production deploy at a time; a newer dispatch cancels an in-progress
# one instead of queueing another full ~20-min run behind it.
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  quality-checks:
    name: Quality Checks & Build
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_tests && !inputs.checks_verified_locally }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: |
          rm -rf packages/shared/dist packages/shared/tsconfig.tsbuildinfo
          cd packages/shared && npx tsc
          test -f dist/db/schema.d.ts || (echo "FATAL: schema.d.ts not created!" && exit 1)

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npx tsc --noEmit
        working-directory: ./web

      - name: Run unit tests
        run: npm run test:unit
        working-directory: ./web
        continue-on-error: true

      - name: Production build test
        run: npm run build
        working-directory: ./web
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          NEXT_PUBLIC_ZERODHA_AFFILIATE_LINK: ${{ secrets.NEXT_PUBLIC_ZERODHA_AFFILIATE_LINK }}
          NEXT_PUBLIC_ANGELONE_AFFILIATE_LINK: ${{ secrets.NEXT_PUBLIC_ANGELONE_AFFILIATE_LINK }}

  deploy:
    name: Deploy to VPS
    runs-on: self-hosted
    needs: quality-checks
    # `needs:` on a skipped job normally skips the dependent too - `always()`
    # overrides that so a SKIPPED quality-checks (via skip_tests or
    # checks_verified_locally) still lets the deploy proceed, while a
    # genuinely FAILED quality-checks (result == 'failure', neither input
    # set) is NOT in this OR-list and therefore still blocks the deploy.
    if: ${{ always() && (needs.quality-checks.result == 'success' || inputs.skip_tests || inputs.checks_verified_locally) }}

    env:
      DEPLOY_DIR: C:\Apps\IPODhan\current
      BACKUP_DIR: C:\Apps\IPODhan\backups
      LOGS_DIR: C:\Apps\IPODhan\logs
      APP_NAME: ipodhan-web

    steps:
      - name: Initialize environment
        shell: powershell
        run: |
          Write-Host "[INFO] Initializing deployment environment..."
          $directories = @($env:DEPLOY_DIR, $env:BACKUP_DIR, $env:LOGS_DIR)
          foreach ($dir in $directories) {
            if (-not (Test-Path $dir)) {
              New-Item -ItemType Directory -Path $dir -Force | Out-Null
              Write-Host "[OK] Created: $dir"
            }
          }

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Keep gitignored build artifacts (node_modules, .next/cache) in the
          # runner workspace between runs so installs + Next builds are
          # incremental instead of from-scratch every deploy.
          clean: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Validate local-verification evidence
        # checks_verified_locally=true means the hosted quality-checks job
        # was skipped - this makes an unexplained skip impossible by hard
        # failing before any deploy work if the evidence field was left
        # blank, and records what/where into the job summary for later readers.
        if: ${{ inputs.checks_verified_locally }}
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace($env:LOCAL_EVIDENCE)) {
            Write-Host "[ERROR] checks_verified_locally=true requires local_verification_evidence (what was verified, and where) - refusing to deploy on an unexplained skip."
            exit 1
          }
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### Hosted quality-checks SKIPPED - verified locally instead"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "$env:LOCAL_EVIDENCE"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "_The full check suite is re-run on this self-hosted runner before any files are replaced - see 'Re-run quality checks on self-hosted runner' below._"
          Write-Host "[OK] Local-verification evidence recorded to job summary"
        env:
          LOCAL_EVIDENCE: ${{ inputs.local_verification_evidence }}

      - name: Create backup
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'

          # Prune FIRST so a run of failed deploys can't fill the disk: keep only
          # the single most recent backup. (Also prune one-off db-backups.)
          if (Test-Path $env:BACKUP_DIR) {
            Get-ChildItem $env:BACKUP_DIR -Directory | Sort-Object LastWriteTime -Descending |
              Select-Object -Skip 1 | ForEach-Object { Remove-Item $_.FullName -Recurse -Force -ErrorAction SilentlyContinue }
          }
          $dbBackups = 'C:\Apps\IPODhan\db-backups'
          if (Test-Path $dbBackups) {
            Get-ChildItem $dbBackups -File | Sort-Object LastWriteTime -Descending |
              Select-Object -Skip 1 | ForEach-Object { Remove-Item $_.FullName -Force -ErrorAction SilentlyContinue }
          }

          $timestamp = Get-Date -Format "yyyy-MM-dd-HHmmss"
          $backupPath = "$env:BACKUP_DIR\backup-$timestamp"

          if (Test-Path "$env:DEPLOY_DIR\web") {
            # robocopy excluding node_modules + .next: they are huge, lock-prone,
            # and rebuilt by npm + build on rollback. robocopy exit < 8 = success.
            robocopy $env:DEPLOY_DIR $backupPath /E /XD node_modules .next /NFL /NDL /NJH /NJS /NP /R:1 /W:1 | Out-Null
            if ($LASTEXITCODE -ge 8) { Write-Host "[ERROR] backup robocopy exit $LASTEXITCODE"; exit 1 }
            $global:LASTEXITCODE = 0
            Write-Host "[OK] Backup created: $backupPath"
            echo "BACKUP_PATH=$backupPath" >> $env:GITHUB_ENV
          } else {
            Write-Host "[WARN] No existing deployment to backup"
          }

      - name: Install dependencies (skip if lockfile unchanged)
        shell: powershell
        run: |
          $hash = (Get-FileHash package-lock.json -Algorithm SHA256).Hash
          $marker = "node_modules\.deploy-lockhash"
          if ((Test-Path node_modules) -and (Test-Path $marker) -and ((Get-Content $marker -Raw).Trim() -eq $hash)) {
            Write-Host "[OK] Dependencies unchanged - skipping install"
          } else {
            Write-Host "[INFO] Lockfile changed or node_modules missing - installing..."
            npm ci --production=false
            $hash | Out-File -FilePath $marker -Encoding ascii -NoNewline
          }

      - name: Build shared package
        run: npm run build
        working-directory: ./packages/shared

      - name: Re-run quality checks on self-hosted runner (local-verification path)
        # Mirrors the hosted quality-checks job's lint/typecheck/unit-test
        # steps (same commands: root `npm run lint` / `npm run test:unit` -
        # both delegate to the web workspace - and `npx tsc --noEmit` in
        # web/). Runs ONLY when checks_verified_locally=true, i.e. only when
        # the hosted job was skipped - so skipping the hosted job never means
        # skipping tests, only running them somewhere free. This step runs
        # BEFORE "Stop PM2 processes" / "Deploy files", so a failure here
        # aborts the job before any live file is touched or process is killed.
        if: ${{ inputs.checks_verified_locally }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "[INFO] checks_verified_locally=true - re-running lint/typecheck/unit tests on the self-hosted runner before touching the live app."

          npm run lint
          if ($LASTEXITCODE -ne 0) { Write-Host "[ERROR] lint failed"; exit 1 }

          Push-Location web
          npx tsc --noEmit
          $typecheckExit = $LASTEXITCODE
          Pop-Location
          if ($typecheckExit -ne 0) { Write-Host "[ERROR] TypeScript type check failed"; exit 1 }

          npm run test:unit
          if ($LASTEXITCODE -ne 0) { Write-Host "[ERROR] unit tests failed"; exit 1 }

          Write-Host "[OK] Self-hosted re-verification passed - proceeding to deploy"

      - name: Build web application (incremental - keeps .next/cache)
        shell: powershell
        run: |
          # Remove only the build OUTPUT, preserving .next/cache (the Next
          # compiler cache) so the build is incremental, not from-scratch.
          if (Test-Path web\.next) {
            Get-ChildItem web\.next -Force | Where-Object { $_.Name -ne 'cache' } |
              Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          }
          cd web; npm run build
        env:
          # next build OOM'd on the self-hosted runner (exit 134,
          # NewSpace::EnsureCurrentCapacity) under memory pressure after the
          # bundle grew - raise the V8 old-space heap so the build has headroom.
          NODE_OPTIONS: --max-old-space-size=4096
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          NEXT_PUBLIC_ZERODHA_AFFILIATE_LINK: ${{ secrets.NEXT_PUBLIC_ZERODHA_AFFILIATE_LINK }}
          NEXT_PUBLIC_ANGELONE_AFFILIATE_LINK: ${{ secrets.NEXT_PUBLIC_ANGELONE_AFFILIATE_LINK }}

      - name: Create environment files
        shell: powershell
        run: |
          # Web .env.local
          $webEnv = @"
          NODE_ENV=production
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          REDIS_URL=${{ secrets.REDIS_URL }}
          ADMIN_API_TOKEN=${{ secrets.ADMIN_API_TOKEN }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID=${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          NEXT_PUBLIC_ZERODHA_AFFILIATE_LINK=${{ secrets.NEXT_PUBLIC_ZERODHA_AFFILIATE_LINK }}
          NEXT_PUBLIC_ANGELONE_AFFILIATE_LINK=${{ secrets.NEXT_PUBLIC_ANGELONE_AFFILIATE_LINK }}
          "@
          $webEnv | Out-File -FilePath "web\.env.local" -Encoding UTF8

          # Scraper .env
          $scraperEnv = @"
          NODE_ENV=production
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          REDIS_URL=${{ secrets.REDIS_URL }}
          SCRAPER_ENABLED=true
          SCRAPER_INTERVAL_MODE=prod
          ENABLE_SOURCE_TRACKING=true
          ENABLE_CONFLICT_DETECTION=true
          ENABLE_DATA_CONSOLIDATION=true
          ADMIN_API_TOKEN=${{ secrets.ADMIN_API_TOKEN }}
          WEB_INTERNAL_URL=http://localhost:3001
          NOTIFIER_URL=${{ secrets.NOTIFIER_URL }}
          NOTIFIER_KEY=${{ secrets.NOTIFIER_KEY }}
          NOTIFIER_PROJECT=${{ secrets.NOTIFIER_PROJECT }}
          "@
          $scraperEnv | Out-File -FilePath "scraper\.env" -Encoding UTF8

      - name: Verify required env keys were written
        shell: powershell
        run: |
          # Fails the deploy loudly if a required key is missing from either
          # generated .env file - never let a dropped key (like NOTIFIER_KEY
          # in T-224) degrade into silent no-alerting. Checks key NAMES only;
          # never reads or echoes values.
          $webRequired = @(
            'NODE_ENV','DATABASE_URL','REDIS_URL','ADMIN_API_TOKEN',
            'NEXT_PUBLIC_GA_MEASUREMENT_ID','NEXT_PUBLIC_ZERODHA_AFFILIATE_LINK',
            'NEXT_PUBLIC_ANGELONE_AFFILIATE_LINK'
          )
          $scraperRequired = @(
            'NODE_ENV','DATABASE_URL','REDIS_URL','SCRAPER_ENABLED',
            'SCRAPER_INTERVAL_MODE','ENABLE_SOURCE_TRACKING',
            'ENABLE_CONFLICT_DETECTION','ENABLE_DATA_CONSOLIDATION',
            'ADMIN_API_TOKEN','WEB_INTERNAL_URL',
            'NOTIFIER_URL','NOTIFIER_KEY','NOTIFIER_PROJECT'
          )

          function Test-EnvKeys {
            param([string]$Path, [string[]]$RequiredKeys)
            $lines = Get-Content -Path $Path
            $present = @{}
            foreach ($line in $lines) {
              $trimmed = $line.Trim()
              if ($trimmed -match '^([A-Za-z_][A-Za-z0-9_]*)=') {
                $present[$Matches[1]] = $true
              }
            }
            $missing = $RequiredKeys | Where-Object { -not $present.ContainsKey($_) }
            return $missing
          }

          $missingWeb = Test-EnvKeys -Path "web\.env.local" -RequiredKeys $webRequired
          $missingScraper = Test-EnvKeys -Path "scraper\.env" -RequiredKeys $scraperRequired

          if ($missingWeb.Count -gt 0) {
            Write-Host "[FATAL] web\.env.local is missing required keys: $($missingWeb -join ', ')"
          }
          if ($missingScraper.Count -gt 0) {
            Write-Host "[FATAL] scraper\.env is missing required keys: $($missingScraper -join ', ')"
          }
          if ($missingWeb.Count -gt 0 -or $missingScraper.Count -gt 0) {
            Write-Error "Required env key(s) missing after generation - aborting deploy before any files are touched. This check exists because NOTIFIER_URL/NOTIFIER_KEY/NOTIFIER_PROJECT silently vanished on a prior deploy (T-224) and owner alerting went dark with no signal."
            exit 1
          }
          Write-Host "[OK] All required keys present in both generated env files"

      - name: Stop PM2 processes (release file locks)
        shell: powershell
        run: |
          # The web/scraper dirs cannot be replaced while PM2 holds open file
          # handles on them (Remove-Item -> "being used by another process").
          # Delete the apps (not just stop) so the subsequent `pm2 start
          # ecosystem.config.js` re-reads the config - `pm2 reload` does NOT
          # pick up ecosystem changes (autorestart/cron), so config edits would
          # otherwise never take effect.
          foreach ($app in @('ipodhan-web','ipodhan-scraper')) {
            try { pm2 delete $app 2>$null | Out-Null; Write-Host "[OK] Deleted $app" }
            catch { Write-Host "[INFO] $app not running" }
          }
          Start-Sleep -Seconds 3  # let the OS release the file handles

      - name: Deploy files
        shell: powershell
        run: |
          Write-Host "[INFO] Deploying to: $env:DEPLOY_DIR"

          # Copy web application (including .next build)
          if (Test-Path "$env:DEPLOY_DIR\web") {
            Remove-Item -Path "$env:DEPLOY_DIR\web" -Recurse -Force
          }
          Copy-Item -Path "web" -Destination "$env:DEPLOY_DIR\web" -Recurse -Force

          # Copy shared packages (built dist) - clean first to avoid nesting
          if (Test-Path "$env:DEPLOY_DIR\packages\shared") {
            Remove-Item -Path "$env:DEPLOY_DIR\packages\shared" -Recurse -Force
          }
          New-Item -ItemType Directory -Path "$env:DEPLOY_DIR\packages" -Force | Out-Null
          Copy-Item -Path "packages\shared" -Destination "$env:DEPLOY_DIR\packages\shared" -Recurse -Force

          # Copy scraper
          if (Test-Path "$env:DEPLOY_DIR\scraper") {
            Remove-Item -Path "$env:DEPLOY_DIR\scraper" -Recurse -Force
          }
          Copy-Item -Path "scraper" -Destination "$env:DEPLOY_DIR\scraper" -Recurse -Force

          # Copy root package files for monorepo
          Copy-Item -Path "package.json" -Destination $env:DEPLOY_DIR -Force
          Copy-Item -Path "package-lock.json" -Destination $env:DEPLOY_DIR -Force

          Write-Host "[OK] Files deployed"

      - name: Install production dependencies (skip if lockfile unchanged)
        shell: powershell
        run: |
          cd $env:DEPLOY_DIR
          $hash = (Get-FileHash package-lock.json -Algorithm SHA256).Hash
          $marker = "node_modules\.deploy-lockhash"
          if ((Test-Path node_modules) -and (Test-Path $marker) -and ((Get-Content $marker -Raw).Trim() -eq $hash)) {
            Write-Host "[OK] Dependencies unchanged - skipping install"
          } else {
            Write-Host "[INFO] Installing production dependencies..."
            npm ci --production=false
            $hash | Out-File -FilePath $marker -Encoding ascii -NoNewline
          }

      - name: Create ecosystem.config.js
        shell: powershell
        run: |
          $ecosystemConfig = @"
          module.exports = {
            apps: [
              // Web Application (Next.js) - Always running
              // Uses npm workspace - node_modules resolved from root via NODE_PATH
              {
                name: 'ipodhan-web',
                script: 'C:\\Apps\\IPODhan\\current\\node_modules\\next\\dist\\bin\\next',
                args: 'start -p 3001',
                cwd: 'C:\\Apps\\IPODhan\\current\\web',
                instances: 2,
                exec_mode: 'cluster',
                max_memory_restart: '500M',
                env: {
                  NODE_ENV: 'production',
                  PORT: 3001,
                  TZ: 'UTC',
                  NODE_PATH: 'C:\\Apps\\IPODhan\\current\\node_modules'
                },
                error_file: 'C:\\Apps\\IPODhan\\logs\\web-error.log',
                out_file: 'C:\\Apps\\IPODhan\\logs\\web-out.log',
                log_date_format: 'YYYY-MM-DD HH:mm:ss Z',
                merge_logs: true,
                time: true,
                autorestart: true,
                max_restarts: 10,
                min_uptime: '10s',
                listen_timeout: 5000,
                kill_timeout: 5000
              },
              // Scraper Service - scheduled ONE-SHOT scrape.
              // CRITICAL: autorestart MUST be false. src/index.ts scrapes once
              // and exits; under autorestart:true PM2 restarts it instantly =
              // a ~4s infinite loop (GitHub #2). With autorestart:false the
              // process exits cleanly and STAYS stopped; cron_restart fires it
              // again on schedule. This is PM2's scheduled-one-shot pattern.
              // (Adopting the richer src/scheduler/index.ts is tracked
              // separately - that entrypoint has unrelated bit-rot to repair.)
              {
                name: 'ipodhan-scraper',
                script: 'C:\\Apps\\IPODhan\\current\\node_modules\\tsx\\dist\\cli.mjs',
                args: 'src/index.ts --source=all',
                cwd: 'C:\\Apps\\IPODhan\\current\\scraper',
                instances: 1,
                exec_mode: 'fork',
                max_memory_restart: '500M',
                autorestart: false,
                cron_restart: '*/30 * * * *',
                env: {
                  NODE_ENV: 'production',
                  SCRAPER_INTERVAL_MODE: 'prod',
                  TZ: 'UTC',
                  // GMP/subscription coverage flags - MUST be regenerated here or a
                  // deploy silently turns them off (they live in the committed
                  // ecosystem.config.js per 07470243, but this step overwrites it).
                  // The */30 --source=all cron is what runs the GMP scraper in prod;
                  // name-match is what lifts coverage past the few date-exact matches.
                  ENABLE_GMP_NAME_MATCH: 'true',
                  ENABLE_MONEYCONTROL_SUBSCRIPTION: 'true',
                  // BSE source rebuilt on the JSON API (the Puppeteer/HTML scraper
                  // is dead - BSE migrated to a SPA). Switches the BSE orchestrator
                  // from the dead scraper to scrapeBSEViaAPI (list IR_flag=IPO ->
                  // detail + subscription) for the current board. PR #26.
                  ENABLE_BSE_API: 'true',
                  NODE_PATH: 'C:\\Apps\\IPODhan\\current\\node_modules'
                },
                error_file: 'C:\\Apps\\IPODhan\\logs\\scraper-error.log',
                out_file: 'C:\\Apps\\IPODhan\\logs\\scraper-out.log',
                log_date_format: 'YYYY-MM-DD HH:mm:ss Z',
                merge_logs: true,
                time: true,
                kill_timeout: 10000
              }
            ]
          };
          "@
          $ecosystemConfig | Out-File -FilePath "$env:DEPLOY_DIR\ecosystem.config.js" -Encoding UTF8

      - name: Run database migrations
        shell: powershell
        continue-on-error: true  # Schema may already be up to date
        run: |
          # Run from work directory where node_modules exists
          cd web
          npx drizzle-kit migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: PM2 start from ecosystem config
        shell: powershell
        run: |
          cd $env:DEPLOY_DIR

          # The apps were deleted in the Stop step, so start fresh from the
          # ecosystem config. This (not `pm2 reload`) is what makes config
          # changes - autorestart:false, cron_restart - actually take effect.
          #
          # CRITICAL: do NOT `pm2 delete` here. pm2 writes "Process not found"
          # to stderr when the app is already gone, and PowerShell 5.1 under
          # Actions (ErrorActionPreference=Stop) turns native-command stderr
          # into a TERMINATING error - that aborts the step before `pm2 start`
          # runs and leaves production with nothing started. Set Continue so a
          # benign pm2 stderr line cannot fail the step, then gate on the real
          # start exit code.
          $ErrorActionPreference = 'Continue'

          pm2 start ecosystem.config.js
          $startExit = $LASTEXITCODE
          pm2 save
          pm2 list

          if ($startExit -ne 0) {
            Write-Host "[ERROR] pm2 start failed with exit $startExit"
            exit 1
          }
          Write-Host "[OK] PM2 started from ecosystem.config.js"

      - name: Ensure PM2 log rotation (prevent unbounded log growth)
        shell: powershell
        run: |
          # Caps every PM2 app's logs so a chatty process (e.g. the scraper)
          # can never fill the disk again. Idempotent: pm2 install is a no-op
          # if the module is already present. 50M x (5 retained) per stream.
          $ErrorActionPreference = 'Continue'
          pm2 install pm2-logrotate
          pm2 set pm2-logrotate:max_size 50M
          pm2 set pm2-logrotate:retain 5
          pm2 set pm2-logrotate:compress true
          pm2 set pm2-logrotate:rotateInterval '0 0 * * *'
          pm2 set pm2-logrotate:workerInterval 60
          pm2 set pm2-logrotate:rotateModule true
          Write-Host "[OK] pm2-logrotate configured (50M max, retain 5, compressed)"

      - name: Health check
        shell: powershell
        run: |
          Start-Sleep -Seconds 8

          $maxAttempts = 10
          $healthy = $false

          for ($i = 1; $i -le $maxAttempts; $i++) {
            Write-Host "Health check attempt $i/$maxAttempts..."
            try {
              $response = Invoke-WebRequest -Uri "http://localhost:3001" -TimeoutSec 5 -UseBasicParsing
              if ($response.StatusCode -eq 200) {
                $healthy = $true
                Write-Host "[OK] Health check passed"
                break
              }
            } catch {
              Start-Sleep -Seconds 3
            }
          }

          if (-not $healthy) {
            Write-Host "[ERROR] Health check failed"
            exit 1
          }

      - name: Rollback on failure
        if: failure()
        shell: powershell
        run: |
          # Continue past benign pm2 stderr (PS 5.1 + Actions would otherwise
          # turn "Process not found" into a terminating error mid-rollback).
          $ErrorActionPreference = 'Continue'
          if ($env:BACKUP_PATH -and (Test-Path $env:BACKUP_PATH)) {
            Write-Host "[INFO] Rolling back..."
            # Delete PM2 apps first so they release file handles - otherwise
            # Remove-Item fails with "being used by another process" (the same
            # lock that can break the deploy itself).
            foreach ($app in @('ipodhan-web','ipodhan-scraper')) {
              pm2 delete $app 2>$null | Out-Null
            }
            Start-Sleep -Seconds 3
            Remove-Item -Path $env:DEPLOY_DIR -Recurse -Force
            Copy-Item -Path $env:BACKUP_PATH -Destination $env:DEPLOY_DIR -Recurse -Force
            cd $env:DEPLOY_DIR
            # Backup excludes node_modules/.next (see Create backup), so reinstall
            # + rebuild the restored source before starting.
            npm ci --production=false
            cd packages\shared; npm run build; cd $env:DEPLOY_DIR
            cd web; npm run build; cd $env:DEPLOY_DIR
            pm2 start ecosystem.config.js
            pm2 save
            Write-Host "[OK] Rollback complete"
          }

      # Backup pruning moved to the start of "Create backup" (prune-first, keep 1)
      # so failed deploys can't accumulate backups and fill the disk.

      - name: Deployment summary
        if: always()
        shell: powershell
        run: |
          Write-Host "`n=========================================="
          Write-Host "DEPLOYMENT SUMMARY"
          Write-Host "=========================================="
          Write-Host "Timestamp: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"
          Write-Host "Deploy Dir: $env:DEPLOY_DIR"
          Write-Host "`nPM2 Status:"
          pm2 list
