name: Secret Scan (CI backstop)

# CI backstop for scripts/check-staged-secrets.js. Until now the ONLY secret
# scan was the .husky/pre-commit hook, which runs on the committer's machine
# and did not run at all in worktrees created before 2026-09-25 (see
# git-stash-worktree-guard / husky-install-in-worktrees history) — so a
# credential added on a machine or worktree where the hook never installed
# reached origin with nothing to catch it in CI.
#
# Deliberately its OWN workflow with NO `paths`/`paths-ignore` filter: unlike
# pr-gate.yml (lint/type-check/unit tests, skipped on docs-only PRs — see that
# workflow's `paths` comment), a secret can hide in a doc, a fixture, a config
# file, or a comment just as easily as in application code, so this MUST run
# on every PR into main regardless of which paths changed.
on:
  pull_request:
    branches: [main]

concurrency:
  group: secret-scan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan PR added lines for credentials
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Need the base ref present locally so `git diff origin/<base>...HEAD`
          # below can resolve it — a shallow (depth-1) checkout only has the
          # PR merge commit, same reasoning as pr-gate.yml's checkout step.
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Secret-scan rule self-tests (range mode + staged mode, shared rules)
        # Mutation-proof: imports/drives the real scripts/check-staged-secrets.js
        # and scripts/lib/secret-rules.js, so a weakened rule or a broken range
        # parser turns this red before the live scan below can silently stop
        # catching that class.
        run: node --test scripts/tests/check-staged-secrets-range.test.mjs

      - name: Staged-mode self-test (pre-commit hook's own suite, run here too)
        # scripts/tests/check-staged-secrets.test.sh was never wired into any
        # CI workflow before this — it existed, passed locally, and a
        # regression in the pre-commit path would have merged green.
        run: bash scripts/tests/check-staged-secrets.test.sh

      - name: Scan this PR's added lines for credentials
        # Same RULES as the pre-commit hook (scripts/lib/secret-rules.js).
        # Output names the file and rule only — never the matched value.
        run: node scripts/check-staged-secrets.js --range "origin/${{ github.base_ref }}...HEAD"
