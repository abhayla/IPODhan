name: Frontend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'ipodhan-web/**'
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v3

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: 📦 Install dependencies
      working-directory: ./ipodhan-web
      run: npm install

    - name: 🧪 Run linter
      working-directory: ./ipodhan-web
      run: npm run lint

    - name: ✅ Run tests
      working-directory: ./ipodhan-web
      run: npm test

    - name: 🏗️ Build application
      working-directory: ./ipodhan-web
      run: npm run build