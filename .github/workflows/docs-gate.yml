# The gates whose ONLY input is documentation, run on the pull requests that
# change documentation.
#
# WHY THIS FILE EXISTS (#541). `pr-gate.yml` skips docs-only pull requests at the
# trigger level, to avoid burning Actions minutes running the scraper suite for a
# typo in a README. That is right for almost everything in it — and exactly wrong
# for the design-consistency gate, which lives inside it and whose entire input is
# `docs/`. The result was that a pull request changing nothing but build cards
# skipped the one check that could evaluate it, reported "no checks reported"
# (an absence, not a pass), merged, and broke that gate on main for every other
# lane. It happened on 2026-09-10: #537 cited a file that did not exist yet, and
# the failure surfaced on an unrelated scraper PR.
#
# The fix is NOT to widen pr-gate's `paths` — that would make a README typo run
# the full scraper suite, which is the cost the skip exists to avoid. Instead the
# documentation gates move out from behind it, into this workflow, which runs on
# the complement of what pr-gate covers plus the docs pr-gate already includes.
#
# There is deliberately NO `npm ci` here. Every script it runs imports only
# `node:` builtins — asserted by a test, not assumed — so this workflow is a
# checkout, a node, and three commands.
name: Docs gates

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.md'
      - 'docs/**'

concurrency:
  group: docs-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  docs:
    name: Design consistency & registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Docs-gate coverage self-test
        # A change to the documentation must reach a gate that reads the
        # documentation. Runs in BOTH workflows on purpose: editing pr-gate.yml
        # is a CODE change, so it triggers pr-gate and not docs-gate - and that
        # is exactly the edit most likely to put the documentation gates back
        # behind a skip. A self-test that only runs on the PRs it is about is
        # the same blind spot one level up.
        run: node --test scripts/ci/tests/check-docs-gate-coverage.test.mjs

      - name: Build cards keep their promise
        # Run explicitly as well as via the design gate below, so a build-card
        # failure names itself in the step list instead of arriving as one line
        # of D16's output.
        run: node docs/design/check-build-cards.mjs --gate

      - name: Design consistency gate
        # The check that #537 skipped past. 23 rules over the design document,
        # the build cards, the owner decisions and the code citations.
        run: node docs/design/check-design-consistency.mjs

      - name: Detection registry matches its per-entry sources
        # Same argument: its input is docs/reviews/**, so a docs-only change is
        # exactly when it matters and exactly when pr-gate would not run it.
        run: node scripts/build-detection-registry.mjs --check

      - name: Pull-model delta Definition of Done (item 33)
        # check-dod.mjs used to hard-code process.chdir() to a worktree that no longer
        # exists, so it threw ENOENT before its first assertion in every checkout
        # including main, and was referenced by no workflow — nothing noticed for nine
        # days. It now resolves its root from cwd (CI checks out the repo at the
        # workflow's cwd, so no argument is needed here).
        #
        # continue-on-error: this DoD's items assert the state of the 2026-09-09
        # pull-model design DELTA (O-14/O-15 fork rows, specific walkthrough files,
        # etc). It is a historical record, not a live gate on every future PR's
        # content — an item drifting true-to-false as work legitimately continues past
        # that delta must not turn every unrelated docs PR red. The point of this step
        # is that the walker RUNS and its report is visible in the step list; a run
        # nobody can see is exactly how this script went unnoticed for nine days.
        run: node docs/design/check-dod.mjs
        continue-on-error: true

      - name: check-dod.mjs D14-mechanism self-test (item 33, #829)
        # The DoD item "New owner forks recorded" hard-coded two fork ids (O-14, O-15) and
        # went red the moment those forks were correctly ANSWERED on 2026-09-09. It now
        # delegates to check-design-consistency.mjs, which owns D14 and enforces the real
        # mechanism. This test guards that delegation and, more importantly, the CLASS: no
        # DoD item may assert a specific fork id is present. It ran in NO workflow before
        # this step existed - the regression guard was itself unguarded.
        #
        # NOT continue-on-error: unlike the DoD walk above, these assert properties of the
        # SCRIPT that must hold on every PR, not the state of a 2026-09-09 delta.
        run: |
          # check-dod-root-resolution.test.mjs is NOT run here: three of its four cases
          # drive a FULL check-dod run, and one full run takes many minutes because it
          # spawns check-mutations.test.mjs (which mutates and restores real files).
          # Measured 2026-09-22: a single case had not finished after 15 minutes. It also
          # runs two of those DoD walks concurrently in one checkout, so they mutate the
          # same files at once. Run it by hand when touching root resolution.
          node --test scripts/tests/check-dod-d14-mechanism.test.mjs
