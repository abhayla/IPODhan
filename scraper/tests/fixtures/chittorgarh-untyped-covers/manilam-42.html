<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Under Maintenance</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fa;
            color: #1f2937;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .maintenance-container {
            width: 100%;
            max-width: 650px;
            text-align: center;
            background: #ffffff;
            padding: 60px 40px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
        }

        .icon {
            width: 90px;
            height: 90px;
            margin: 0 auto 30px;
            border-radius: 50%;
            background: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
        }

        h1 {
            font-size: 38px;
            margin-bottom: 18px;
            color: #111827;
        }

        p {
            font-size: 17px;
            line-height: 1.7;
            color: #6b7280;
            margin-bottom: 12px;
        }

        .small-text {
            font-size: 14px;
            margin-top: 25px;
            color: #9ca3af;
        }

        @media (max-width: 600px) {
            .maintenance-container {
                padding: 45px 25px;
            }

            h1 {
                font-size: 30px;
            }

            p {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="maintenance-container">

        <div class="icon">
            🔧
        </div>

        <h1>We'll Be Back Soon</h1>

        <p>
            Our website is currently undergoing scheduled maintenance.
        </p>

        <p>
            We're working to improve your experience and will be back online shortly.
        </p>

        <p class="small-text">
            Thank you for your patience and understanding.
        </p>

    </div>

</body>
</html>
